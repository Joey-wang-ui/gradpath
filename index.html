<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gradpath · 你的美研申请工作台</title>

<style>
/* Gradpath — bright, blue, and a little closer to your next chapter. */
:root {
  color-scheme: light;
  --bg: #f3f7ff;
  --paper: #ffffff;
  --ink: #19365f;
  --body: #526a8d;
  --muted: #7084a0;
  --line: #dce7f6;
  --green: #3266cf;
  --forest: #1c4080;
  --mint: #eaf2ff;
  --lime: #d9eaff;
  --orange: #b77c45;
  --sidebar: 236px;
  --shadow: 0 12px 36px rgb(35 82 154 / 7%);
  --ease: cubic-bezier(.22, .8, .25, 1);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scrollbar-gutter: stable; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; }
button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
button { border: 0; background: none; color: inherit; cursor: pointer; }
button, a { touch-action: manipulation; }
a { color: inherit; text-decoration: none; }
button:disabled { cursor: default; opacity: .45; }
button, input, textarea, select, a { outline-offset: 4px; }
:focus-visible { outline: 3px solid #5e7ea9; }
::selection { color: #16273e; background: #c8dbf2; }
button, a, input, select, textarea {
  transition: color .2s, background .2s, border-color .2s, box-shadow .2s, transform .25s var(--ease);
}
button:active:not(:disabled), .primary-button:active, .secondary-button:active { transform: translateY(1px) scale(.985); }
button svg, a svg { pointer-events: none; }
svg { display: block; }
i[data-icon] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}
i svg {
  width: 19px;
  height: 19px;
  stroke: currentColor;
  stroke-width: 1.7;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* The persistent frame */
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  width: var(--sidebar);
  height: 100dvh;
  padding: 34px 19px 0;
  border-right: 1px solid var(--line);
  background: #ffffff;
}
.brand {
  display: flex;
  align-items: center;
  width: fit-content;
  padding: 0 10px;
  color: #17283f;
  font-size: 28px;
  font-weight: 750;
  letter-spacing: -1.4px;
  line-height: 1;
}
.brand-dot { color: #6684ac; }
.brand-mark {
  position: relative;
  width: 35px;
  height: 37px;
  margin-right: 9px;
  padding: 0 3px 2px 0;
  border-radius: 12px 12px 4px 12px;
  background: var(--forest);
  color: #ffffff;
  font-family: Georgia, serif;
  font-size: 36px;
  font-weight: 500;
  line-height: 32px;
  text-align: center;
  letter-spacing: -3px;
  box-shadow: 0 4px 8px #17283f10;
}
.brand-mark span {
  position: absolute;
  top: -3px;
  right: -3px;
  width: 10px;
  height: 10px;
  border: 2px solid #ffffff;
  border-radius: 50%;
  background: #90b2df;
}
.workspace-select {
  display: flex;
  align-items: center;
  gap: 11px;
  margin: 34px 0 30px;
  padding: 13px 12px;
  border: 1px solid #eaecf0;
  border-radius: 11px;
  background: #ffffff;
  font-size: 12px;
  font-weight: 600;
}
.workspace-icon {
  display: grid;
  place-items: center;
  width: 34px;
  height: 37px;
  border: 1px solid #e1e7ee;
  border-radius: 7px;
  background: #ffffff;
  color: #4e6583;
  font-family: Georgia, serif;
  font-size: 19px;
  font-weight: 500;
  box-shadow: 0 2px 4px #17283f06;
}
.workspace-select small {
  display: block;
  margin-top: 5px;
  color: #71849d;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 1.15px;
}
.workspace-select small span { margin-left: 7px; color: #506682; font-size: 9px; letter-spacing: 0; }
.chevrons { margin-left: auto; color: #7b8da4; line-height: 9px; }
.nav-label { margin-bottom: 13px; padding: 0 15px; color: #8797ac; font-size: 9px; font-weight: 650; letter-spacing: 2px; }
nav { display: flex; flex-direction: column; gap: 6px; }
nav a {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 45px;
  padding: 12px 15px;
  border-radius: 9px;
  color: #62758d;
  font-size: 12px;
  font-weight: 500;
}
nav a:hover { background: #f5f7fa; color: #243c5b; transform: translateX(3px); }
nav a.active { background: #ebf0f6; color: #273f5e; font-weight: 650; }
nav a.active::before {
  position: absolute;
  inset: 15px auto 15px -19px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: #4d6686;
  content: "";
}
nav a.active i { color: #375174; }
.nav-new { margin-left: auto; color: #7487a0; font-size: 8px; font-weight: 750; letter-spacing: .6px; }
.nav-count { margin-left: auto; padding: 2px 7px; border-radius: 5px; background: #f1f4f7; color: #5e7087; font-size: 10px; }
nav a.active .nav-count { background: #d8e2ee; color: #354c6a; }
.sidebar-guide {
  position: relative;
  overflow: hidden;
  margin: 38px 4px 22px;
  padding: 19px 17px 18px;
  border: 1px solid #e7ecf2;
  border-radius: 12px;
  background: linear-gradient(135deg, #f4f5e9, #fafbfc);
}
.sidebar-guide::after { position: absolute; top: -30px; right: -38px; width: 100px; height: 100px; border: 1px solid #d5deea; border-radius: 50%; content: ""; }
.guide-spark { margin-bottom: 16px; color: #567aaa; font-size: 34px; line-height: 1; }
.sidebar-guide h3 { margin: 0 0 9px; color: #404f63; font-size: 13px; font-weight: 600; }
.sidebar-guide p { margin: 0 0 17px; color: #71849c; font-size: 10px; line-height: 1.9; }
.text-button { display: flex; align-items: center; gap: 17px; padding: 0; color: #475a74; font-size: 10px; font-weight: 600; }
.text-button:hover { gap: 23px; color: #23364e; }
.sidebar-bottom { margin-top: auto; }
.help-button { display: flex; align-items: center; gap: 11px; width: 100%; padding: 15px 12px; color: #657992; font-size: 11px; }
.help-button:hover { color: var(--green); }
.help-button > span { margin-left: auto; }
.account { display: flex; align-items: center; gap: 10px; padding: 21px 5px; border-top: 1px solid var(--line); }
.avatar {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 35px;
  height: 35px;
  border: 3px solid #ffffff;
  border-radius: 50%;
  background: #e0e7f1;
  color: #3e5471;
  box-shadow: 0 0 0 1px #e6e9ee;
  font-size: 14px;
  font-weight: 600;
}
.account strong { font-size: 11px; font-weight: 600; }
.account small { display: block; margin-top: 3px; color: #7e8fa5; font-size: 9px; }
.account .icon-button { margin-left: auto; }
.icon-button { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; min-height: 32px; padding: 6px; border-radius: 8px; color: #6e819a; }
.icon-button:hover { background: #f1f4f8; color: #3c4e65; }
.app-shell { margin-left: var(--sidebar); }
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  height: 79px;
  padding: 0 37px;
  border-bottom: 1px solid var(--line);
  background: #ffffffad;
}
.breadcrumb { display: flex; align-items: center; gap: 14px; color: #7d8ea4; font-size: 11px; white-space: nowrap; }
.breadcrumb strong { color: #485668; font-weight: 550; }
.breadcrumb > span { color: #c1c9d4; }
.topbar-actions { display: flex; align-items: center; gap: 17px; }
.global-search { display: flex; align-items: center; gap: 9px; min-width: 180px; padding: 8px 10px; border: 1px solid #eaedf2; border-radius: 8px; color: #8091a7; font-size: 10px; text-align: left; }
.global-search i, .global-search i svg { width: 14px; height: 14px; }
.global-search kbd { margin-left: auto; padding: 1px 4px; border: 1px solid #e5e9ef; border-radius: 3px; color: #8e9db0; font-family: inherit; font-size: 9px; }
.global-search:hover { border-color: #b4c3d6; background: #fafbfd; color: #465b77; }
.notification { position: relative; }
.notification b { position: absolute; top: 6px; right: 8px; width: 5px; height: 5px; border: 1px solid #ffffff; border-radius: 50%; background: #d09968; }
.topbar-divider { width: 1px; height: 22px; background: #e5e9ef; }
.small { width: 31px; height: 31px; font-size: 11px; }
.mobile-logo { display: none; }
main { max-width: 1680px; margin: auto; padding: 32px 37px 35px; }
main > .page-heading, main > .toolbar, main > .main-grid, main > .document-layout, main > .profile-card, main > .library-grid, main > .application-table { animation: rise-in .6s var(--ease) both; }
main > .main-grid, main > .library-grid, main > .document-layout { animation-delay: .05s; }
.page-heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 27px; }
.eyebrow { margin-bottom: 9px; color: #71849d; font-size: 9px; font-weight: 650; letter-spacing: 2.1px; }
.page-heading h1 { margin: 0 0 9px; color: #1a2c44; font-size: 29px; font-weight: 600; letter-spacing: -1px; line-height: 1.35; }
.page-heading p { margin: 0; color: #74869e; font-size: 11px; line-height: 1.8; }
.date-label { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid #e2e7ee; border-radius: 7px; background: #ffffff; color: #667a93; font-size: 10px; white-space: nowrap; }
.date-label i, .date-label i svg { width: 14px; height: 14px; }
.main-grid { display: grid; grid-template-columns: minmax(0, 1fr) 292px; align-items: start; gap: 24px; }
.main-column { min-width: 0; }

/* The overview: a calm starting point, with a clear next action. */
.hero {
  position: relative;
  display: flex;
  align-items: center;
  min-height: 328px;
  overflow: hidden;
  padding: 29px 31px 45px;
  border: 1px solid #d6dfec;
  border-radius: 17px;
  background: linear-gradient(115deg, #ecf1f7 0%, #ecf1f7 43%, #e1e9f3 100%);
  isolation: isolate;
}
.hero::before { position: absolute; top: -110px; right: -125px; width: 480px; height: 480px; border: 1px solid #cfd9e7; border-radius: 50%; content: ""; z-index: -1; }
.hero::after { position: absolute; top: -63px; right: -78px; width: 386px; height: 386px; border: 1px solid #cfd9e780; border-radius: 50%; content: ""; z-index: -1; }
.hero-copy { position: relative; z-index: 2; width: 70%; max-width: 430px; }
.hero-topline, .hero-label { display: flex; align-items: center; gap: 7px; margin-bottom: 20px; color: #5c7391; font-size: 8px; font-weight: 600; letter-spacing: 1.6px; }
.hero-live-dot { width: 5px; height: 5px; border-radius: 50%; background: #4b71a3; box-shadow: 0 0 0 4px #5074a212; }
.hero h2 { position: relative; margin: 0 0 15px; color: #25354b; font-size: clamp(34px, 3vw, 43px); font-weight: 600; line-height: 1.45; letter-spacing: -1.8px; }
.hero-title-accent { position: relative; display: inline-block; color: #3f5b80; }
.hero-title-accent::after { position: absolute; right: -3px; bottom: 2px; left: 0; height: 6px; border-radius: 50%; background: #a7bfde; content: ""; z-index: -1; transform: rotate(-2deg); }
.hero p { margin: 0 0 23px; color: #677a94; font-size: 10px; line-height: 1.9; }
.primary-button { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 38px; padding: 10px 15px; border: 1px solid #263f5f; border-radius: 7px; background: #28405f; color: #ffffff; font-size: 10px; font-weight: 550; box-shadow: 0 3px 5px #1c2e460a; }
.primary-button:hover { border-color: #1a2e49; background: #1a2e49; box-shadow: 0 5px 14px #17283f1a; transform: translateY(-2px); }
.primary-button i, .primary-button i svg { width: 14px; height: 14px; }
.hero-actions { display: flex; align-items: center; gap: 20px; }
.hero .primary-button { gap: 16px; min-height: 39px; padding: 10px 14px; }
.hero-secondary { display: inline-flex; align-items: center; gap: 7px; padding: 7px 0; color: #586b85; font-size: 10px; }
.hero-secondary:hover { color: #273b55; transform: translateX(2px); }
.hero-secondary i, .hero-secondary i svg { width: 13px; height: 13px; }
.hero-bottomline { position: absolute; right: 27px; bottom: 16px; left: 31px; display: flex; align-items: center; justify-content: space-between; padding-top: 11px; border-top: 1px solid #d5deea; color: #7c8da4; font-size: 8px; letter-spacing: 1.1px; }
.hero-bottomline > span:last-child { font-size: 12px; }
.hero-scene { position: absolute; right: -6px; bottom: 42px; width: 45%; max-width: 340px; height: 267px; pointer-events: none; }
.orbit-label { position: absolute; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border: 1px solid #ffffff; border-radius: 7px; background: #ffffffe6; color: #5e738f; box-shadow: 0 6px 15px #3e526b08; font-size: 8px; transform: rotate(-5deg); }
.orbit-label i, .orbit-label i svg { width: 12px; height: 12px; }
.orbit-one { top: 48px; right: 21px; }
.orbit-two { bottom: 33px; left: -7px; transform: rotate(4deg); }
.scene-caption { position: absolute; right: 20px; bottom: -11px; color: #7e91aa; font-size: 7px; font-weight: 550; letter-spacing: 1.9px; }
.overview-jumpbar { display: flex; align-items: center; justify-content: space-between; gap: 7px; margin: 16px 1px 23px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.journey-step { display: flex; align-items: center; gap: 6px; padding: 2px 0; color: #8f9eb1; font-size: 9px; white-space: nowrap; }
.journey-step b, .journey-step > span:first-child { display: grid; place-items: center; width: 19px; height: 19px; border: 1px solid #e4e9ef; border-radius: 50%; font-size: 8px; font-weight: 500; }
.journey-step.active { color: #415774; font-weight: 600; }
.journey-step.active b, .journey-step.active > span:first-child { border-color: #718db1; background: #e6ecf4; color: #415a7a; }
.journey-step.complete { color: #566b86; }
.journey-step.complete b, .journey-step.complete > span:first-child { border-color: #d0dbea; background: #e9eff5; }
.journey-step:hover { color: #24374f; }
.stats-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; margin: 18px 0 28px; }
.stat-card { position: relative; overflow: hidden; min-width: 0; padding: 17px 17px 15px; border: 1px solid var(--line); border-radius: 11px; background: #ffffff; text-align: left; }
button.stat-card { width: 100%; }
.stat-card::after { position: absolute; top: -18px; right: -21px; width: 80px; height: 80px; border: 1px solid #eff2f6; border-radius: 50%; content: ""; opacity: 0; transition: opacity .25s; }
.stat-card:hover { border-color: #bdc9d9; box-shadow: var(--shadow); transform: translateY(-3px); }
.stat-card:hover::after { opacity: 1; }
.stat-label { display: flex; align-items: center; justify-content: space-between; gap: 5px; color: #70839b; font-size: 10px; }
.stat-label i { color: #7c8fa8; }
.stat-label i svg { width: 16px; height: 16px; }
.stat-value { display: flex; align-items: baseline; gap: 7px; margin-top: 15px; color: #283a51; font-size: 33px; font-weight: 550; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -1.4px; }
.stat-value small { color: #8a9aae; font-size: 9px; font-weight: 400; letter-spacing: 0; }
.stat-foot { display: flex; align-items: center; gap: 4px; min-height: 16px; margin-top: 11px; color: #7b8ca3; font-size: 8px; }
.tiny-bar { width: 100%; height: 4px; overflow: hidden; border-radius: 4px; background: #f1f3f7; }
.tiny-bar span { display: block; height: 100%; border-radius: inherit; background: #6784aa; transition: width .4s var(--ease); }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
.section-heading h2 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 14px; font-weight: 600; }
.section-heading h2 span { color: #8b9aae; font-size: 10px; font-weight: 400; }
.section-heading .section-number { color: #9aa7b8; font-size: 9px; font-weight: 500; letter-spacing: .8px; }
.section-heading .view-all { display: flex; align-items: center; gap: 7px; color: #788aa2; font-size: 10px; }
.section-heading .view-all:hover { color: #3b526f; gap: 10px; }
.section-heading .view-all i, .section-heading .view-all i svg { width: 13px; height: 13px; }
.segmented { display: flex; gap: 3px; padding: 3px; border: 1px solid #eaeef3; border-radius: 6px; background: #f0f3f7; }
.segmented button { padding: 4px 9px; border-radius: 4px; color: #7c8da4; font-size: 9px; }
.segmented button.active { background: #ffffff; color: #465b76; box-shadow: 0 1px 4px #252f3d10; }
.segmented button:hover { color: #34465e; }
.tasks-panel { overflow: hidden; border: 1px solid var(--line); border-radius: 11px; background: #ffffff; }
.task-row { display: flex; align-items: center; gap: 12px; padding: 17px; border-bottom: 1px solid #f0f3f7; transition: background .2s; }
.task-row:last-child { border-bottom: 0; }
.task-row:hover { background: #ffffff; }
.task-check { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 19px; height: 19px; padding: 0; border: 1px solid #d5dce6; border-radius: 6px; color: #ffffff; font-size: 11px; }
.task-check:hover { border-color: #647ea1; background: #f0f4f8; box-shadow: 0 0 0 4px #7d94b210; }
.task-row.completed .task-check { border-color: #5a7599; background: #5a7599; }
.task-row.completed { background: #ffffff; }
.task-copy { flex: 1; min-width: 0; }
.task-copy strong { color: #485668; font-size: 11px; font-weight: 500; }
.task-copy p { display: flex; align-items: center; gap: 7px; margin: 6px 0 0; color: #8d9caf; font-size: 9px; }
.task-copy p span { width: 3px; height: 3px; border-radius: 50%; background: #a5b1c1; }
.task-row.completed .task-copy strong { color: #8d9cb0; text-decoration: line-through; text-decoration-color: #b7c1ce; }
.task-tag { padding: 4px 7px; border-radius: 4px; background: #f8efe2; color: #ad8c5e; font-size: 8px; white-space: nowrap; }
.task-tag.sage { background: #f2f5f9; color: #5c7595; }
.task-tag.blue { background: #edf2f6; color: #7e98ac; }
.task-arrow { display: grid; place-items: center; width: 24px; height: 26px; margin-left: 2px; border-radius: 5px; color: #8e9db0; font-size: 16px; }
.task-arrow:hover { background: #ebf0f6; color: #374f6e; transform: translate(2px, -2px); }
.task-progress { display: flex; align-items: center; gap: 9px; padding: 12px 17px; border-top: 1px solid #f0f3f7; background: #ffffff; color: #8393a8; font-size: 9px; }
.task-progress .tiny-bar { max-width: 130px; margin-left: auto; }
.task-add-form { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px; }
.task-add-form > label { flex: 1; min-width: 180px; }
.task-add-form .primary-button { align-self: flex-end; }

/* Project cards have their own small campus identity. */
.school-section { margin-top: 28px; }
.school-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
.school-card { position: relative; min-width: 0; overflow: hidden; padding: 17px 16px 15px; border: 1px solid var(--line); border-radius: 11px; background: #ffffff; transition: transform .28s var(--ease), box-shadow .28s, border-color .28s; }
.school-card:hover { transform: translateY(-5px); border-color: #bbc8d8; box-shadow: 0 12px 24px #293c550a, 0 3px 8px #293c5504; }
.school-top { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
.school-logo { position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 35px; height: 40px; border: 1px solid color-mix(in srgb, var(--school-color, #425164) 16%, transparent); border-radius: 5px 5px 9px 9px; background: var(--school-bg, #eff2f6); color: var(--school-color, #425164); font-family: Georgia, serif; font-size: 21px; font-weight: 700; letter-spacing: -1.5px; }
.school-logo::after { position: absolute; inset: 3px; border: 1px solid color-mix(in srgb, var(--school-color, #425164) 20%, transparent); border-radius: 2px 2px 6px 6px; content: ""; }
.school-logo span { position: relative; z-index: 1; }
.school-bookmark { color: #9facbd; }
.school-bookmark.saved { color: #4b688d; }
.school-bookmark.saved svg { fill: #dce5f2; }
.school-bookmark:hover { background: #e4eaf3; transform: scale(1.08); }
.school-card h3 { margin: 0 0 5px; color: #3c4857; font-size: 12px; font-weight: 600; letter-spacing: -.1px; }
.school-english { overflow: hidden; color: #8797ab; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
.school-program { margin: 14px 0; color: #60738b; font-size: 10px; }
.school-bottom { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-top: 12px; border-top: 1px solid #f0f3f7; }
.rank-badge { padding: 3px 6px; border: 1px solid #e6ebf1; border-radius: 4px; color: #7a8ca3; font-size: 8px; white-space: nowrap; }
.location { display: flex; align-items: center; gap: 3px; color: #8b9aae; font-size: 8px; }
.location i, .location i svg { width: 11px; height: 11px; }
.school-link { display: block; width: 100%; padding: 0; text-align: left; }
.school-link:hover h3 { color: #314b6c; }
.school-cover { position: relative; height: 96px; margin: -17px -16px 17px; overflow: hidden; background: var(--school-bg, #eff2f7); color: var(--school-color, #4d627e); }
.school-cover::before { position: absolute; top: -58px; right: -20px; width: 180px; height: 180px; border: 1px solid currentColor; border-radius: 50%; content: ""; opacity: .12; }
.school-cover::after { position: absolute; top: -33px; right: 5px; width: 130px; height: 130px; border: 1px solid currentColor; border-radius: 50%; content: ""; opacity: .12; }
.school-cover-lines { position: absolute; bottom: -5px; left: 20px; width: 150px; height: 75px; opacity: .23; transform: skewY(-3deg); }
.school-cover-lines::before { position: absolute; bottom: 0; width: 130px; height: 48px; border: 1px solid currentColor; background: repeating-linear-gradient(90deg, transparent, transparent 12px, currentColor 13px, transparent 14px); content: ""; }
.school-cover-lines::after { position: absolute; bottom: 46px; left: -7px; width: 142px; height: 40px; border: 1px solid currentColor; clip-path: polygon(50% 0, 100% 100%, 0 100%); background: currentColor; content: ""; opacity: .7; }
.school-cover .school-logo { position: absolute; bottom: 16px; left: 18px; width: 41px; height: 45px; border-color: #ffffffaa; background: #ffffffef; box-shadow: 0 4px 8px #14263e06; }
.school-cover .school-bookmark { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; min-width: 28px; min-height: 28px; background: #ffffff9e; color: currentColor; }
.school-cover > span { position: absolute; right: 17px; bottom: 17px; font-family: Georgia, serif; font-size: 29px; opacity: .15; }
.school-card-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 13px; padding-top: 11px; border-top: 1px dashed #eaeef3; }
.school-card-actions > button:first-child { display: inline-flex; align-items: center; gap: 5px; padding: 0; color: #697d97; font-size: 9px; }
.school-card-actions > button:first-child:hover { color: #354964; }
.compare-toggle { display: inline-flex; align-items: center; gap: 5px; padding: 4px 7px; border: 1px solid #e8ecf2; border-radius: 4px; color: #8696ab; font-size: 8px; white-space: nowrap; }
.compare-toggle i, .compare-toggle i svg { width: 11px; height: 11px; }
.compare-toggle[aria-pressed="true"], .compare-toggle.active { border-color: #7894b8; background: #eff3f8; color: #4a6282; }
.compare-toggle:hover { border-color: #a4b5cb; color: #3e5778; }

/* The assistant should feel like an inviting, useful companion. */
.right-column { display: flex; flex-direction: column; gap: 21px; }
.assistant-card { position: relative; overflow: hidden; padding: 23px 20px 18px; border: 1px solid #1c304a; border-radius: 15px; background: linear-gradient(135deg, #21344c 0%, #19293f 60%, #15253a 100%); box-shadow: 0 8px 22px #1d2e4410; color: #ffffff; }
.assistant-card::before { position: absolute; top: -120px; right: -100px; width: 260px; height: 260px; border: 1px solid #ccdef50d; border-radius: 50%; content: ""; }
.assistant-heading { position: relative; display: flex; align-items: center; gap: 10px; }
.assistant-mark { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1px solid #9fbfe926; border-radius: 11px; background: #a4c3eb10; color: #9cbde9; font-size: 29px; line-height: 1; }
.assistant-heading h2 { margin: 0 0 4px; color: #f4f6fa; font-size: 13px; font-weight: 550; }
.assistant-heading p { margin: 0; color: #8395ac; font-size: 7px; letter-spacing: 1.6px; }
.assistant-status { width: 6px; height: 6px; margin-left: auto; border-radius: 50%; background: #99bbe8; box-shadow: 0 0 0 4px #99bbe809; }
.assistant-intro { position: relative; margin: 24px 0 19px; color: #a5b3c5; font-size: 11px; line-height: 2; }
.assistant-intro strong { color: #aac7ee; font-weight: 550; }
.suggestions { position: relative; display: flex; flex-direction: column; gap: 8px; }
.suggestion { display: flex; align-items: center; gap: 9px; padding: 11px 10px; border: 1px solid #adc3df1a; border-radius: 7px; background: #c4d3e705; color: #b1bfd1; font-size: 10px; text-align: left; }
.suggestion:hover { border-color: #c1d4ed40; background: #acc6e80e; color: #e7effa; transform: translateX(2px); }
.suggestion > span { margin-left: auto; color: #7c91ac; }
.suggestion i, .suggestion i svg { width: 14px; height: 14px; color: #859dbd; }
.assistant-input { position: relative; display: flex; align-items: center; gap: 7px; margin-top: 18px; padding: 9px; border: 1px solid #cad8eb25; border-radius: 8px; background: #101d2f1f; }
.assistant-input:focus-within { border-color: #97b8e27a; box-shadow: 0 0 0 3px #97b8e208; }
.assistant-input input { width: 100%; min-width: 0; padding: 2px 0 2px 3px; border: 0; outline: 0; background: transparent; color: #e8eff8; font-size: 10px; }
.assistant-input input::placeholder { color: #7c90ab; }
.assistant-input button { display: grid; place-items: center; width: 26px; height: 26px; padding: 5px; border-radius: 5px; background: #a7c4ea; color: #354253; }
.assistant-input button:hover { background: #d5e4f8; transform: translateY(-1px); }
.assistant-input button i, .assistant-input button svg { width: 13px; height: 13px; }
.assistant-note { margin-top: 11px; color: #667a93; font-size: 8px; text-align: center; }
.deadline-card { padding: 21px 20px; border: 1px solid var(--line); border-radius: 12px; background: #ffffff; }
.deadline-card .section-heading { margin-bottom: 21px; }
.deadline-card .section-heading h2 { font-size: 12px; }
.deadline-card .section-heading > i { color: #8999ae; }
.deadline-card .section-heading > i svg { width: 16px; height: 16px; }
.deadline-row { display: flex; gap: 12px; margin-bottom: 19px; }
.deadline-row:last-of-type { margin-bottom: 0; }
.deadline-date { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; min-width: 39px; height: 45px; border: 1px solid #e7ecf1; border-radius: 7px; background: #fafbfd; color: #546985; font-size: 18px; font-weight: 500; line-height: 1.2; }
.deadline-date span { margin-bottom: 3px; color: #8999ae; font-size: 7px; font-weight: 600; letter-spacing: 1px; }
.deadline-name { margin: 3px 0 6px; color: #505f73; font-size: 11px; font-weight: 500; }
.deadline-meta { color: #8898ac; font-size: 8px; line-height: 1.6; }
.deadline-meta b { margin-left: 6px; color: #b69b73; font-size: 8px; font-weight: 400; white-space: nowrap; }
.date-disclaimer { margin: 17px 0 0; padding-top: 13px; border-top: 1px dashed #e5eaf0; color: #98a5b7; font-size: 8px; line-height: 1.8; }
.journey-note { padding: 3px 18px 7px; text-align: center; }
.journey-note .leaf { margin-bottom: 7px; color: #869bb6; font-family: Georgia, serif; font-size: 32px; transform: rotate(-15deg); }
.journey-note p { margin: 0; color: #8b9aae; font-size: 10px; line-height: 2; }
.journey-note small { display: block; margin-top: 10px; color: #a6b2c1; font-size: 7px; letter-spacing: 2px; }
footer { display: flex; justify-content: space-between; gap: 20px; margin: 0 37px; padding: 20px 0 24px; border-top: 1px solid var(--line); color: #8d9cb0; font-size: 9px; }
footer > span { display: flex; align-items: center; gap: 12px; font-size: 7px; letter-spacing: 1.5px; }
.footer-star { color: #7c92af; font-size: 18px; line-height: 1; }

/* Exploring and comparing programs. */
.toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 13px; margin-bottom: 18px; }
.search-box { display: flex; align-items: center; flex: 1; gap: 9px; min-width: 240px; padding: 12px 13px; border: 1px solid #dfe5ed; border-radius: 8px; background: #ffffff; }
.search-box:focus-within { border-color: #7693b8; box-shadow: 0 0 0 3px #7c98bc12; }
.search-box input { width: 100%; border: 0; outline: 0; background: none; color: #45566d; font-size: 11px; }
.search-box input::placeholder { color: #8d9cb0; }
.search-box i { color: #8595ab; }
.search-box i svg { width: 17px; height: 17px; }
.filter-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-buttons button { padding: 10px 12px; border: 1px solid #e0e6ed; border-radius: 7px; background: #ffffff; color: #74879f; font-size: 10px; white-space: nowrap; }
.filter-buttons button:hover { border-color: #9dafc7; background: #f4f6fa; color: #415774; }
.filter-buttons button.active { border-color: #2d4564; background: #2d4564; color: #f9fbfd; box-shadow: 0 3px 7px #1f324b0b; }
.library-note { margin: 0 0 22px; color: #8091a7; font-size: 10px; line-height: 1.9; }
.library-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.library-grid .school-card { padding: 21px; }
.library-grid .school-cover { height: 121px; margin: -21px -21px 21px; }
.library-grid .school-logo { width: 43px; height: 48px; font-size: 25px; }
.library-grid .school-cover .school-logo { bottom: 17px; left: 21px; }
.library-grid .school-card h3 { font-size: 15px; }
.library-grid .school-program { margin: 19px 0; font-size: 11px; }
.library-grid .school-english { font-size: 10px; }
.library-grid .school-bottom { padding-top: 13px; }
.library-grid .rank-badge, .library-grid .location { font-size: 9px; }
.library-grid .school-card-actions { margin-top: 15px; padding-top: 12px; }
.empty-state { grid-column: 1 / -1; padding: 48px 25px; border: 1px dashed #d3dce7; border-radius: 12px; background: #ffffff; color: #74879f; font-size: 12px; line-height: 2.2; text-align: center; }
.empty-state .secondary-button { margin-top: 15px; }
.compare-bar { position: fixed; z-index: 35; right: 34px; bottom: 24px; left: calc(var(--sidebar) + 34px); display: flex; align-items: center; gap: 10px; max-width: 1060px; margin: 0 auto; padding: 12px 15px; border: 1px solid #b8c7db; border-radius: 12px; background: #ffffffed; box-shadow: 0 12px 50px #28354518, 0 2px 8px #28354506; backdrop-filter: blur(18px); animation: rise-in .3s var(--ease) both; }
.compare-bar > strong { color: #576d8a; font-size: 10px; font-weight: 500; white-space: nowrap; }
.compare-chip { display: inline-flex; align-items: center; gap: 7px; max-width: 160px; padding: 7px 9px; border: 1px solid #dfe5ee; border-radius: 6px; background: #f4f7fa; color: #5a6e89; font-size: 10px; white-space: nowrap; }
.compare-chip button { padding: 0 1px; color: #8898ad; }
.compare-chip button:hover { color: #354963; }
.compare-go { display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin-left: auto; padding: 9px 14px; border-radius: 6px; background: #28405f; color: #f7f9fc; font-size: 10px; white-space: nowrap; }
.compare-go:hover { background: #1c314c; }
.comparison-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.comparison-cell { min-width: 0; padding: 16px 12px; border: 1px solid #e5eaf0; border-radius: 9px; background: #ffffff; }
.comparison-cell h3 { margin: 12px 0 7px; color: #3d4d63; font-size: 12px; }
.comparison-cell p { margin: 8px 0; font-size: 10px; }
.comparison-cell span, .comparison-cell dt { color: #8898ad; font-size: 9px; }
.comparison-cell strong, .comparison-cell dd { display: block; margin: 5px 0 13px; color: #576a83; font-size: 11px; font-weight: 500; }
.comparison-cell .school-logo { width: 36px; height: 40px; font-size: 23px; }
.comparison-grid .comparison-cell:only-child { grid-column: 1 / -1; }
.modal:has(.comparison-grid) { width: min(820px, 100%); }

/* Application planning */
.application-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 23px; }
.summary-chip { display: flex; align-items: center; gap: 11px; padding: 17px 19px; border: 1px solid #e4e9f0; border-radius: 10px; background: #ffffff; color: #7a8ba2; font-size: 11px; }
.summary-chip b, .summary-chip strong { margin-left: auto; color: #455b78; font-size: 23px; font-weight: 550; }
.summary-chip i { color: #7089aa; }
.application-table { overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: #ffffff; }
.application-table table { width: 100%; min-width: 710px; border-collapse: collapse; text-align: left; }
.application-table th { padding: 16px 20px; border-bottom: 1px solid var(--line); background: #ffffff; color: #8494a9; font-size: 10px; font-weight: 500; white-space: nowrap; }
.application-table td { padding: 22px 20px; border-bottom: 1px solid #eff2f7; color: #576980; font-size: 11px; }
.application-table tr:last-child td { border-bottom: 0; }
.application-table tbody tr { transition: background .2s; }
.application-table tbody tr:hover { background: #ffffff; }
.application-school { display: flex; align-items: center; gap: 12px; color: #43556d; }
.application-school small { display: block; margin-top: 5px; color: #8797ac; font-size: 9px; }
.status-select { max-width: 120px; padding: 8px 9px; border: 1px solid #dbe2ec; border-radius: 6px; background: #f6f9fc; color: #546e91; font-size: 10px; cursor: pointer; }
.status-select:hover { border-color: #9db1cb; }
.secondary-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 35px; padding: 8px 12px; border: 1px solid #dbe2eb; border-radius: 6px; background: #ffffff; color: #5e7593; font-size: 10px; font-weight: 500; }
.secondary-button:hover { border-color: #a0b3cb; background: #f5f8fb; color: #3f5675; transform: translateY(-1px); }
.secondary-button i, .secondary-button i svg { width: 14px; height: 14px; }

/* A focused space for a student's own words. */
.document-layout { display: grid; grid-template-columns: 235px minmax(0, 1fr); align-items: start; gap: 22px; }
.document-list { display: flex; flex-direction: column; gap: 11px; }
.document-card { position: relative; padding: 19px; border: 1px solid var(--line); border-radius: 10px; background: #ffffff; text-align: left; }
.document-card:hover { border-color: #a9b9ce; background: #ffffff; transform: translateX(3px); }
.document-card.active { border-color: #7b95b6; background: #f0f4f9; box-shadow: 0 3px 8px #29456a10; }
.document-card.active::after { position: absolute; top: 20px; right: 17px; width: 5px; height: 5px; border-radius: 50%; background: #6781a3; content: ""; }
.document-card h3 { margin: 11px 0 8px; color: #475c77; font-size: 12px; font-weight: 550; }
.document-card p { margin: 0; color: #8797ac; font-size: 9px; line-height: 1.9; }
.document-card > i { color: #7d92ad; }
.document-meta { display: flex; align-items: center; gap: 7px; margin-top: 13px; padding-top: 11px; border-top: 1px solid #e8edf3; color: #8b9baf; font-size: 8px; }
.writing-tips { margin-top: 9px; padding: 17px 15px; border: 1px solid #e4eaf1; border-radius: 9px; background: #f6f8fb; color: #798ba2; font-size: 10px; line-height: 1.9; }
.writing-tips h3 { margin: 0 0 7px; color: #516885; font-size: 11px; font-weight: 550; }
.writing-tips p { margin: 0; }
.editor { min-width: 0; overflow: hidden; border: 1px solid #dfe5ed; border-radius: 12px; background: #ffffff; box-shadow: 0 5px 20px #253a5504; }
.editor-top { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 21px 24px 18px; border-bottom: 1px solid var(--line); }
.editor-top h2 { margin: 0; color: #3d5069; font-size: 14px; font-weight: 550; }
.editor-title-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 6px; color: #91a0b3; font-size: 8px; }
.save-status { color: #788da9; font-size: 9px; white-space: nowrap; }
.editor-tools { display: flex; align-items: center; gap: 7px; }
.focus-button { display: inline-flex; align-items: center; gap: 5px; padding: 7px 9px; border: 1px solid #e4eaf1; border-radius: 5px; background: #ffffff; color: #7d8ea5; font-size: 9px; white-space: nowrap; }
.focus-button i, .focus-button i svg { width: 13px; height: 13px; }
.focus-button:hover, .focus-button[aria-pressed="true"] { border-color: #9db2ce; background: #eef3f9; color: #496181; }
.editor-prompt { padding: 16px 24px; border-bottom: 1px solid var(--line); background: #f9fbfd; color: #72859e; font-size: 10px; line-height: 1.95; }
.editor textarea { display: block; width: 100%; min-height: 405px; height: 435px; padding: 28px 30px; resize: vertical; border: 0; outline: 0; background: #ffffff; color: #46566b; font-size: 12px; line-height: 2.15; letter-spacing: .1px; }
.editor textarea:focus { background: #ffffff; box-shadow: inset 3px 0 0 #c9d9ed; }
.editor-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 24px; border-top: 1px solid var(--line); color: #8c9baf; font-size: 9px; }
.draft-history { margin-top: 18px; padding: 15px 18px; border: 1px solid #e6ebf2; border-radius: 9px; background: #ffffff; color: #8292a8; font-size: 10px; }
.draft-history h3 { margin: 0 0 10px; color: #5e7491; font-size: 11px; font-weight: 550; }
.draft-history button { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 8px 0; border-bottom: 1px solid #ebf0f6; font-size: 10px; text-align: left; }
.draft-history button:last-child { border: 0; }
.draft-history button:hover { color: #3a5374; }
.focus-mode.document-layout { grid-template-columns: minmax(0, 1fr); max-width: 950px; margin-inline: auto; }
.focus-mode .document-list { display: none; }
.focus-mode .editor textarea { min-height: 58dvh; padding: 40px 8%; font-size: 14px; line-height: 2.3; }
.focus-mode .editor { box-shadow: 0 10px 40px #25385208; }

/* Applicant profile */
.profile-card { max-width: 850px; padding: 31px; border: 1px solid var(--line); border-radius: 14px; background: #ffffff; }
.profile-card h2 { margin: 0 0 8px; color: #3c526e; font-size: 16px; font-weight: 550; }
.profile-card > p { margin: 0 0 27px; color: #8494a9; font-size: 10px; line-height: 1.9; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.form-field { display: flex; flex-direction: column; gap: 9px; color: #6a7e98; font-size: 11px; }
.form-field input, .form-field select, .form-field textarea { min-width: 0; padding: 12px; border: 1px solid #dee5ee; border-radius: 7px; outline: 0; background: #ffffff; color: #455a76; font-size: 11px; }
.form-field input::placeholder, .form-field textarea::placeholder { color: #a0adbd; }
.form-field textarea { resize: vertical; line-height: 1.9; }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: #7995b9; background: #ffffff; box-shadow: 0 0 0 3px #849ec112; }
.form-field.full { grid-column: 1 / -1; }
.profile-card .primary-button { margin-top: 26px; }
.profile-note { margin-top: 17px; color: #8f9eb2; font-size: 9px; line-height: 1.9; }

/* Dialogs and useful feedback */
.modal-overlay { position: fixed; z-index: 50; inset: 0; display: flex; align-items: center; justify-content: center; padding: 25px; background: #141e2c80; backdrop-filter: blur(8px); animation: fade-in .2s; }
.modal { width: min(590px, 100%); max-height: 87dvh; overflow-y: auto; padding: 28px; border: 1px solid #f9fbfd; border-radius: 17px; background: #ffffff; box-shadow: 0 30px 100px #121d2c33; animation: modal-in .3s var(--ease) both; }
.modal-header { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 21px; }
.modal-header h2 { margin: 0; color: #34455c; font-size: 20px; font-weight: 550; letter-spacing: -.4px; }
.modal-header .icon-button { margin-right: -5px; }
.modal p { color: #75879f; font-size: 12px; line-height: 1.95; }
.modal .school-logo { width: 48px; height: 54px; margin-bottom: 17px; font-size: 29px; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 16px; margin: 21px 0; padding: 20px; border: 1px solid #e9edf3; border-radius: 9px; background: #f9fbfd; }
.detail-grid span { display: block; margin-bottom: 6px; color: #8c9baf; font-size: 9px; }
.detail-grid strong { color: #586c87; font-size: 12px; font-weight: 500; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 23px; }
.modal .disclaimer { color: #919fb2; font-size: 10px; line-height: 1.9; }
.chat-message { padding: 19px; border: 1px solid #e4eaf3; border-radius: 10px; background: #f5f8fc; color: #5c718d; font-size: 12px; line-height: 2; white-space: pre-line; }
.chat-question { margin-bottom: 17px; color: #5a6e88; font-size: 12px; line-height: 1.8; }
.modal .assistant-input { padding: 11px; border-color: #d8e1ed; background: #ffffff; }
.modal .assistant-input input { color: #4d637f; font-size: 11px; }
.modal .assistant-input input::placeholder { color: #9caabd; }
.modal .assistant-input button { background: #dce5f2; color: #5b7597; }
.guide-step { display: flex; gap: 15px; margin-top: 22px; }
.guide-step > b { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 29px; height: 29px; border: 1px solid #dbe4f0; border-radius: 9px; background: #eef3f9; color: #6a85a8; font-size: 11px; font-weight: 550; }

/* One university workspace, with a list and a map beneath its disclosure. */
.library-nav-group { min-width: 0; }
.library-nav-toggle { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 49px; padding: 12px 15px; border-radius: 9px; color: #57677c; font-size: 15px; font-weight: 500; text-align: left; }
.library-nav-toggle:hover { background: #f5f7fa; color: #243c5b; }
.library-nav-toggle.active, .library-nav-toggle[aria-expanded="true"] { background: linear-gradient(110deg, #e6ecf4, #f1f4f9); color: #273f5e; font-weight: 650; }
.library-nav-toggle.active::before { position: absolute; inset: 15px auto 15px -19px; width: 3px; border-radius: 0 3px 3px 0; background: #4d6686; content: ''; }
.library-nav-chevron { display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; width:20px; height:20px; margin-left:auto; color:#92a6bf; transition:rotate .22s var(--ease),color .22s var(--ease); }
.library-nav-chevron svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.library-nav-toggle:hover .library-nav-chevron { color:#527cab; }
.library-nav-toggle[aria-expanded="true"] .library-nav-chevron { rotate:90deg; color:#527cab; }
.library-subnav { display: grid; gap: 4px; margin: 8px 0 6px 25px; padding-left: 13px; border-left: 1px solid #d7dde6; }
.library-subnav-label { display: none; }
.library-subnav a { position: relative; display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 9px 10px; border-radius: 7px; font-size: 13px; font-weight: 450; color: #63768e; }
.library-subnav a::before, .library-subnav a.active::before { position: absolute; inset: 50% auto auto -14px; width: 9px; height: 1px; background: #d7dde6; border-radius: 0; content: ''; }
.library-subnav a.active { background: #eeeaf7; color: #70618a; font-weight: 600; }
.library-subnav a.active i { color: inherit; }
.library-subnav a i, .library-subnav a svg { width: 15px; height: 15px; }
@media (min-width: 1500px) { .library-nav-toggle.active::before { left: -23px; } }

  .library-nav-toggle.active { background: transparent; color: #394f6c; }

  .library-subnav-label { display: block; padding: 4px 10px 8px; font-size: 10px; color: #75879f; letter-spacing: 1px; }

/* Workspace visual system: a neutral canvas, blue actions, and clear density. */
:root { --bg:#f7f9fc; --paper:#fff; --ink:#253b58; --body:#52647d; --muted:#718096; --line:#e2e8f0; --green:#3972be; --forest:#295b9b; --mint:#edf4ff; --lime:#d9e9ff; --spark:#6d9cda; --sidebar:220px; --shadow:0 8px 24px #263c5e08; }
body { background:radial-gradient(ellipse at 95% 0%,#edf5ff80,transparent 55%),var(--bg); color:var(--ink); font-size:14px; }
main { max-width:1440px; padding:28px 36px 32px; }
.page-heading { margin-bottom:24px; }

.secondary-button:hover { color:#315f9a; background:#f6f9fe; border-color:#b7cbe6; }
.text-button { color:#5d7faa; }
.sidebar { padding:28px 16px 0; background:#fff; border-right-color:var(--line); overflow-y:auto; scrollbar-width:thin; }
.brand { color:#2d5b9b; font-size:27px; }
.brand-mark { background:#3269b0; }
.brand-dot { color:#83a9da; }
.brand-tagline { color:#8c9ab0; font-size:10px; }
.workspace-select { margin:26px 0 22px; border-color:#e5eaf1; background:#fafbfd; font-size:13px; }
.workspace-select small,.workspace-select small span { font-size:10px; color:#8190a6; }
.nav-label { display:none; }
nav { gap:4px; }
nav a,.library-nav-toggle { min-height:44px; padding:11px 13px; font-size:13px; font-weight:500; color:#6a7a90; gap:11px; }

/* The calendar opens from the centre of the toolbar. */

.calendar-popover { position:fixed; z-index:45; top:73px; left:calc((100% + var(--sidebar))/2); width:min(520px,calc(100% - var(--sidebar) - 32px)); max-height:calc(100dvh - 105px); overflow-y:auto; padding:22px; border:1px solid #dce6f3; border-radius:15px; background:#fffffffa; box-shadow:0 18px 55px #2d527b20; transform:translateX(-50%); animation:calendar-expand .22s var(--ease) both; }

.calendar-panel-heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:17px; }

.calendar-season { margin:14px 0; color:#8c9db2; font-size:11px; }
.calendar-timeline { position:relative; }
.calendar-timeline::before { position:absolute; top:17px; bottom:23px; left:24px; width:1px; background:#e2eaf5; content:""; }
.calendar-event { position:relative; display:flex; align-items:flex-start; gap:15px; width:100%; padding:0 0 20px; text-align:left; }

.calendar-event-date { display:flex; flex-direction:column; align-items:center; justify-content:center; width:49px; min-width:49px; height:58px; border:1px solid #dce7f5; border-radius:10px; background:#f5f9ff; color:#6084b2; }

@media (max-width:1180px) { .topbar-center .global-search { min-width:34px; width:34px; justify-content:center; padding:7px; } }
@media (max-width:760px) {

}
/* Home: one main action, then the student's own work and dates. */
.overview-title { display:inline-block; }

.hero-crest { position:absolute; z-index:1; display:flex; align-items:center; justify-content:center; aspect-ratio:1; border:0; background:transparent; box-shadow:none; mix-blend-mode:multiply; transform:translate(-50%,-50%) rotate(var(--crest-angle)); animation:crest-drift 7s ease-in-out infinite; }
.hero-crest img { display:block; width:86%; height:86%; object-fit:contain; filter:saturate(.7); opacity:.88; mask-image:radial-gradient(ellipse at center,#000 48%,#000e 65%,#0008 82%,transparent 100%); }
@keyframes crest-drift { 50% { translate:0 -5px; } }

      state.profile={...state.profile,...values};state.profileSaved=true;
      const persisted=save();render();
      open(backgroundReturn.question||'请根据我附上的真实背景和文书题目，帮我写一版个人陈述草稿。请先判断信息是否足够；缺少项目要求、事实或细节时先追问，不要编造。',{profile:true,document:backgroundReturn.document});
      toast(persisted?'写作背景已保存，发送问题时可选择附上':'背景已更新，当前浏览器无法保存，请备份');
      return true;
    }
    if(form.dataset.form!=='gpt')return false;
    send(data.get('question'));return true;
  }
  return {open,handle,onSubmit,cancel,hasBackground,backgroundSummary};
})();

// Portable SVG geography: no map tiles, API credentials, or external requests.
const MapWorkspace = (() => {
  const geography=SchoolCatalog.map || {width:1120,height:720,states:[],points:[]};
  const points=new Map(geography.points.map(p=>[p.id,p]));
  let query='',region='all',tier='all',scope='ranked',savedOnly=false,selectedId='',clusterIds=[];
  let zoom=1,panX=0,panY=0,drag=null;
  const regionNames={all:'全美探索',east:'东部',midwest:'中西部',south:'南部',west:'西部'};
  function matching() {
    const q=query.trim().toLowerCase();
    return schools.filter(s=>points.has(s.id)&&(scope==='all'||s.rankNumber!==null)&&(region==='all'||points.get(s.id).region===region)&&(tier==='all'||s.tier===tier)&&(!savedOnly||state.saved.includes(s.id))&&`${s.name} ${s.english} ${s.location} ${s.stateCode}`.toLowerCase().includes(q)).sort((a,b)=>(a.rankNumber??999)-(b.rankNumber??999)||a.english.localeCompare(b.english));
  }
  function clusters() {
    const groups=[];
    for(const s of matching()) {
      const p=points.get(s.id);const group=groups.find(g=>Math.hypot(g.x-p.x,g.y-p.y)<27/zoom);
      if(group){group.ids.push(s.id);group.x=(group.x*(group.ids.length-1)+p.x)/group.ids.length;group.y=(group.y*(group.ids.length-1)+p.y)/group.ids.length;}
      else groups.push({x:p.x,y:p.y,ids:[s.id]});
    }
    return groups;
  }
  function pinsHTML() {
    return clusters().map(g=>{
      const multiple=g.ids.length>1,s=schools.find(s=>s.id===g.ids[0]);const active=g.ids.includes(selectedId);
      return `<g class="map-marker ${multiple?'is-cluster':''} ${active?'is-selected':''}" transform="translate(${g.x},${g.y})" role="button" tabindex="0" aria-label="${multiple?`查看附近 ${g.ids.length} 所院校`:escapeHTML('在地图中选择'+s.name)}" data-action="${multiple?'map-cluster':'map-select'}" data-id="${g.ids[0]}" data-schools="${g.ids.join(',')}"><title>${multiple?g.ids.map(id=>schools.find(s=>s.id===id).name).join(' / '):escapeHTML(s.name)}</title><circle class="map-hit" r="${24/zoom}"/><circle class="map-pin-ring" r="${(multiple?16:13)/zoom}"/><circle class="map-pin-dot" r="${(multiple?12:7)/zoom}"/>${multiple?`<text text-anchor="middle" dominant-baseline="central" font-size="${12/zoom}">${g.ids.length}</text>`:''}</g>`;
    }).join('');
  }
  function selectedHTML() {
    const s=matching().find(s=>s.id===selectedId);
    if(!s)return `<div class="map-start"><span class="eyebrow">A PLACE FOR YOUR NEXT CHAPTER</span><h2>下一站，会在哪里？</h2><p>点击地图标记或下方学校，了解城市与院校，再去挑选适合自己的硕士项目。</p><span>${icon('location')}从地图，走向你的申请清单。</span></div>`;
    const count=SchoolCatalog.programDirectory?.schools.find(r=>r.schoolId===s.id)?.colleges.reduce((n,c)=>n+c.programs.length,0)||0;
    return `<div class="map-school-detail"><div class="map-school-top">${schoolLogo(s)}<span class="rank-badge">${escapeHTML(s.rank)}</span></div><h2>${escapeHTML(s.name)}</h2><p>${escapeHTML(s.english)}</p><div class="map-school-location">${icon('location')}${escapeHTML(s.location)}<span>${s.control}大学</span></div><div class="map-program-count">${count} 个已收录硕士条目<span>主校区位置 · IPEDS 2023</span></div><div class="map-school-actions"><button class="primary-button" data-action="school" data-id="${s.id}">学院与项目 ${icon('arrow')}</button><button class="icon-button ${state.saved.includes(s.id)?'saved':''}" data-action="bookmark" data-id="${s.id}" aria-label="${state.saved.includes(s.id)?'取消关注':'关注'}${s.name}">${icon('bookmark')}</button></div></div>`;
  }
  function listHTML() {
    const all=matching();const visible=clusterIds.length?all.filter(s=>clusterIds.includes(s.id)):all;
    return `${clusterIds.length?`<div class="map-cluster-caption">附近 ${visible.length} 所院校<button data-action="map-clear-cluster">显示全部 ×</button></div>`:''}${visible.length?visible.map(s=>`<button class="map-list-school ${selectedId===s.id?'selected':''}" data-action="map-select" data-id="${s.id}" aria-pressed="${selectedId===s.id}"><span><strong>${escapeHTML(s.name)}</strong><small>${escapeHTML(s.location)}</small></span><b>${escapeHTML(s.rankNumber===null?'档案':s.rank)}</b>${icon('arrow')}</button>`).join(''):`<div class="map-list-empty">没有符合条件的学校。<button data-action="map-reset-filters">重置筛选</button></div>`}`;
  }
  function renderMap() {
    const results=matching();
    return `${heading('全美院校地图','沿着城市，发现下一站。查看资料库收录院校的主校区位置。','FIND YOUR PLACE IN THE WORLD',`<a class="secondary-button" href="#schools">${icon('list')}切换院校列表</a>`)}<section class="map-workspace"><div class="map-filters"><label class="map-search">${icon('search')}<input id="map-search" aria-label="搜索地图中的学校或城市" placeholder="搜索院校、城市或州…" value="${escapeHTML(query)}" maxlength="100"></label><select id="map-region" aria-label="地图区域">${Object.entries(regionNames).map(([key,title])=>`<option value="${key}" ${region===key?'selected':''}>${title}</option>`).join('')}</select><select id="map-tier" aria-label="地图排名范围">${[['all','全部排名范围'],['10','Top 10'],['30','Top 11–30'],['50','Top 31–50']].map(([key,title])=>`<option value="${key}" ${tier===key?'selected':''}>${title}</option>`).join('')}</select><button class="map-saved-filter ${savedOnly?'active':''}" data-action="map-saved" aria-pressed="${savedOnly}">${icon('bookmark')}只看已关注</button></div><div class="map-layout"><div class="map-main"><div class="map-stage-heading"><div><span class="map-live-dot"></span><strong id="map-count" role="status">${results.length} 所院校</strong><span id="map-region-label">${regionNames[region]}</span></div><div class="map-stage-legend"><i></i>院校 / 附近多所院校</div></div><div class="map-viewport" id="map-viewport"><svg id="university-map" viewBox="0 0 1120 720" aria-label="美国各州院校分布地图"><defs><pattern id="map-water-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#c9d7d3" opacity=".6"/></pattern></defs><rect width="1120" height="720" fill="url(#map-water-dots)"/><g id="map-transform" transform="translate(${panX},${panY}) scale(${zoom})"><g class="map-states">${geography.states.map(s=>`<path d="${s.path}" data-state="${s.code}"><title>${s.name}</title></path>`).join('')}</g><g class="map-state-labels">${geography.states.filter(s=>!['DC','DE','RI','CT','MA','NJ'].includes(s.code)).map(s=>`<text x="${s.labelX}" y="${s.labelY}">${s.code}</text>`).join('')}</g><text class="map-ocean-label" x="65" y="380" transform="rotate(-65 65 380)">PACIFIC OCEAN</text><text class="map-ocean-label" x="985" y="460" transform="rotate(-60 985 460)">ATLANTIC OCEAN</text><g id="map-pins">${pinsHTML()}</g></g></svg><div class="map-controls"><button data-action="map-zoom-in" aria-label="放大地图">+</button><button data-action="map-zoom-out" aria-label="缩小地图">−</button><button data-action="map-reset-view" aria-label="重置地图视图">${icon('focus')}</button></div><span class="map-pan-hint">拖动平移 · 点击聚合标记查看附近学校</span></div><div class="map-footnote"><span>校区坐标：NCES IPEDS HD2023 · 州界：PublicaMundi</span><label>展示范围<select id="map-scope" aria-label="地图院校档案范围"><option value="ranked" ${scope==='ranked'?'selected':''}>PDF 榜单院校</option><option value="all" ${scope==='all'?'selected':''}>全部 53 份档案</option></select></label></div></div><aside class="map-sidebar" aria-label="地图院校详情"><div id="map-selected">${selectedHTML()}</div><div class="map-list-heading"><span>在地图中发现</span><button data-action="map-reset-filters">重置筛选</button></div><div id="map-school-list" class="map-school-list">${listHTML()}</div></aside></div></section><p class="profile-note">地图显示当前资料库中的学校。位置为历史主校区坐标，不代表每个项目的实际上课校区；具体项目位置请另查学院官网。</p>`;
  }
  function refresh() {
    if(!document.querySelector('#map-viewport'))return;
    const matches=matching();
    if(selectedId&&!matches.some(s=>s.id===selectedId))selectedId='';
    document.querySelector('#map-pins').innerHTML=pinsHTML();
    document.querySelector('#map-selected').innerHTML=selectedHTML();
    document.querySelector('#map-school-list').innerHTML=listHTML();
    document.querySelector('#map-count').textContent=`${matches.length} 所院校`;
    document.querySelector('#map-region-label').textContent=regionNames[region];
  }
  function transform() {
    const el=document.querySelector('#map-transform');if(el)el.setAttribute('transform',`translate(${panX},${panY}) scale(${zoom})`);
    const pins=document.querySelector('#map-pins');if(pins)pins.innerHTML=pinsHTML();
  }
  function changeZoom(next) {
    const clamped=Math.max(1,Math.min(8,next));const factor=clamped/zoom;
    panX=560-(560-panX)*factor;panY=360-(360-panY)*factor;zoom=clamped;transform();
  }
  function resetFilters() {query='';region='all';tier='all';savedOnly=false;clusterIds=[];render();}
  function handle(action,button) {
    if(!action.startsWith('map-'))return false;
    if(action==='map-select'){selectedId=button.dataset.id;clusterIds=[];refresh();}
    else if(action==='map-cluster'){clusterIds=button.dataset.schools.split(',');selectedId='';refresh();}
    else if(action==='map-clear-cluster'){clusterIds=[];refresh();}
    else if(action==='map-saved'){savedOnly=!savedOnly;clusterIds=[];button.classList.toggle('active',savedOnly);button.setAttribute('aria-pressed',String(savedOnly));refresh();}
    else if(action==='map-reset-filters')resetFilters();
    else if(action==='map-zoom-in')changeZoom(zoom*1.6);
    else if(action==='map-zoom-out')changeZoom(zoom/1.6);
    else if(action==='map-reset-view'){zoom=1;panX=panY=0;transform();}
    return true;
  }
  function onInput(input) {if(input.id==='map-search'){query=input.value;clusterIds=[];refresh();}}
  function onChange(input) {
    if(input.id==='map-region')region=input.value;
    else if(input.id==='map-tier')tier=input.value;
    else if(input.id==='map-scope')scope=input.value;
    else return;
    clusterIds=[];refresh();
  }
  function pointerDown(event) {
    if(!event.target.closest('#university-map')||event.target.closest('[data-action]')||event.button!==0)return;
    drag={x:event.clientX,y:event.clientY,panX,panY};document.querySelector('#map-viewport').classList.add('dragging');
  }
  function pointerMove(event) {if(!drag)return;const rect=document.querySelector('#university-map')?.getBoundingClientRect();if(!rect){drag=null;return;}panX=drag.panX+(event.clientX-drag.x)*1120/rect.width;panY=drag.panY+(event.clientY-drag.y)*720/rect.height;transform();}
  function pointerUp(){drag=null;document.querySelector('#map-viewport')?.classList.remove('dragging');}
  function onKeydown(event){if(event.target.matches('.map-marker')&&['Enter',' '].includes(event.key)){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}}
  return {render:renderMap,handle,onInput,onChange,pointerDown,pointerMove,pointerUp,onKeydown};
})();

// Source-backed reference entries; admission terms are deliberately left to official pages.
const ProgramWorkspace = (() => {
  const directory = SchoolCatalog.programDirectory || {schools:[]};
  const universityIndex = new Map(directory.schools.map(s=>[s.schoolId,s]));
  const programIndex = new Map();
  directory.schools.forEach(s=>s.colleges.forEach(c=>c.programs.forEach(p=>programIndex.set(p.id,{...p,schoolId:s.schoolId,college:c}))));
  let viewingSchool = '';
  let detailFromSearch = false;
  let collegeFilter = 'all';
  let query = '';
  let degreeFilter='all',modeFilter='all',visibleLimit=24;
  const modeNames={'unknown':'形式待核对','on-campus':'线下','online':'线上','hybrid':'混合'};
  const label = p => `${p.degree} · ${p.english}`;
  function choices(id) {
    const values = state.programChoices?.[id];
    return Array.isArray(values)?[...new Set(values)].filter(pid=>programIndex.get(pid)?.schoolId===id):[];
  }
  function resolve(id) {
    const p=programIndex.get(id);
    if (!p) return schools.find(s=>s.id===id);
    const s=schools.find(s=>s.id===p.schoolId);
    return s?{...s,id:p.id,schoolId:s.id,programId:p.id,programName:p.name,program:label(p),collegeName:p.college.name,degree:p.degree,field:p.field,url:p.url,status:'了解项目',deadline:null,isProgramExample:false}:undefined;
  }
  function hasLegacyWork(id) {
    return Boolean(state.statuses[id] || Object.keys(state.applicationDetails[id] || {}).length || state.projectDocuments.includes(id) || state.drafts[`sop-${id}`] !== undefined || state.versions[`sop-${id}`]?.length);
  }
  function items() {
    return schools.filter(s=>state.saved.includes(s.id)).flatMap(s=>{
      const ids=choices(s.id);
      const keepLegacy = hasLegacyWork(s.id) || (!ids.length && !Object.prototype.hasOwnProperty.call(state.programChoices,s.id));
      return [...(keepLegacy?[s]:[]),...ids.map(resolve)];
    });
  }
  function selected(id) { const p=programIndex.get(id);return p && state.saved.includes(p.schoolId) && choices(p.schoolId).includes(id); }
  function addButton(p) {
    if (p.admissionMode==='check-route') return `<a class="secondary-button" href="${escapeHTML(p.url)}" target="_blank" rel="noopener noreferrer">先核对招生路径 ↗</a>`;
    const added=selected(p.id);
    return `<button class="${added?'secondary-button':'primary-button'}" data-action="program-add" data-id="${p.id}">${icon(added?'check':'plus')}${added?'已加入 · 打开申请':'加入我的申请'}</button>`;
  }
  function card(p,c) {
    return `<article class="degree-card" data-program="${p.id}"><div class="degree-card-top"><span class="degree-field">${escapeHTML(p.field)}</span><span class="degree-type">${escapeHTML(p.degree)}</span></div><button class="degree-title" data-action="program-detail" data-id="${p.id}"><h3>${escapeHTML(p.name)}</h3><span>${escapeHTML(label(p))}</span></button><div class="degree-college">${icon('school')}${escapeHTML(c.name)}</div>${p.campus || p.deliveryMode && p.deliveryMode!=='unknown'?`<p class="degree-location">${escapeHTML([p.campus,p.deliveryMode!=='unknown'?modeNames[p.deliveryMode]:''].filter(Boolean).join(' · '))}</p>`:''}${p.admissionMode==='check-route'?'<p class="degree-route-note">需先确认独立硕士招生路径</p>':''}<div class="degree-card-actions"><button class="degree-more" data-action="program-detail" data-id="${p.id}">了解项目 ${icon('arrow')}</button>${addButton(p)}</div></article>`;
  }
  function matching() {
    const school=universityIndex.get(viewingSchool);
    const text=query.trim().toLocaleLowerCase();
    return (school?.colleges || []).filter(c=>collegeFilter==='all'||c.id===collegeFilter).flatMap(c=>c.programs.filter(p=>(degreeFilter==='all'||p.degree===degreeFilter)&&(modeFilter==='all'||(p.deliveryMode||'unknown')===modeFilter)&&`${p.name} ${p.english} ${p.degree} ${p.field} ${c.name} ${c.english}`.toLocaleLowerCase().includes(text)).map(p=>({p,c})));
  }
  function resultHTML() {

    return matches.length?matches.slice(0,visibleLimit).map(({p,c})=>card(p,c)).join('')+(matches.length>visibleLimit?`<button class="secondary-button degree-load-more" data-action="program-more">继续查看 · 还有 ${matches.length-visibleLimit} 个项目 ${icon('arrow')}</button>`:''):`<div class="degree-empty">${icon('search')}<h3>换个方向，再找找。</h3><p>当前收录范围里没有匹配项目，可清除筛选或前往全校研究生入口继续查询。</p><button class="secondary-button" data-action="program-reset">重置筛选</button></div>`;
