    viewingSchool=id;
    const units=entry?.colleges || [];
    const count=units.reduce((n,c)=>n+c.programs.length,0);
    const reviewed=units.reduce((n,c)=>n+c.programs.filter(p=>p.sourceEvidence?.length).length,0);
    const unitCount=units.filter(c=>c.unitType!=='directory').length;
    const codes=[...new Set(units.flatMap(c=>c.programs.map(p=>p.degree)))].sort();
    openModal(s.name,`<div class="university-profile" style="--school-color:${s.color};--school-bg:${s.bg}"><div class="university-profile-main">${schoolLogo(s)}<div><span class="eyebrow">FIND YOUR PROGRAM, WRITE YOUR NEXT CHAPTER</span><h3>${escapeHTML(s.english)}</h3><p>${escapeHTML(s.location)}<span>·</span>${s.control}大学<span>·</span><b>${escapeHTML(s.rank)}</b></p></div></div><div class="university-profile-links"><a class="secondary-button" href="${escapeHTML(s.homepage)}" target="_blank" rel="noopener noreferrer">学校官网 ↗</a><a class="primary-button" href="${escapeHTML(entry?.catalogURL || s.homepage)}" target="_blank" rel="noopener noreferrer">全校研究生入口 ↗</a></div></div><div class="degree-intro"><div><span class="eyebrow">SCHOOLS & MASTER’S PROGRAMS</span><h2>找到你的学术方向。</h2><p>已收录 ${count} 个硕士项目与方向 · ${unitCount} 个已归类学术单位</p></div><span class="degree-reference-label">${reviewed?`${reviewed} 条按官网目录整理`:'参考条目 · 待核对'}</span></div><div class="program-browser"><aside class="college-browser" aria-label="学院筛选"><button data-action="program-college" data-college="all" aria-pressed="${collegeFilter==='all'}"><span>全部学院</span><b>${count}</b></button>${units.map(c=>`<button data-action="program-college" data-college="${c.id}" aria-pressed="${collegeFilter===c.id}"><span>${escapeHTML(c.name)}<small>${escapeHTML(c.english)}</small></span><b>${c.programs.length}</b></button>`).join('')}<p>先看课程与学位，再确认申请方式。</p></aside><section class="degree-results-area" aria-label="硕士项目"><label class="degree-search">${icon('search')}<input id="program-search" aria-label="搜索本校硕士项目" placeholder="搜索项目、专业方向或学位…" value="${escapeHTML(query)}" maxlength="120"></label><div class="degree-filter-row"><select id="program-degree" aria-label="筛选硕士学位"><option value="all">全部硕士学位</option>${codes.map(code=>`<option value="${escapeHTML(code)}" ${degreeFilter===code?'selected':''}>${escapeHTML(code)}</option>`).join('')}</select><select id="program-mode" aria-label="筛选授课形式"><option value="all">全部授课形式</option>${Object.entries(modeNames).map(([key,name])=>`<option value="${key}" ${modeFilter===key?'selected':''}>${name}</option>`).join('')}</select></div><div class="degree-results-summary"><span>按兴趣，找到值得深入了解的项目</span><b id="degree-result-count" role="status">${matching().length} 个结果</b></div><div class="degree-grid" id="degree-results">${resultHTML()}</div><p class="degree-scope">当前目录持续补充。校内衔接、联合学位与专业方向需先确认申请路径；完整范围请查全校研究生入口。</p></section></div>${facts(s)}<div class="university-bottom-actions"><button class="text-button" data-action="bookmark" data-id="${id}" data-modal="true">${icon(state.saved.includes(id)?'bookmark':'plus')}${state.saved.includes(id)?'已关注院校 · 点击移除':'先关注这所院校'}</button><a class="text-button" href="#applications">查看我的申请 ${icon('arrow')}</a></div>`);
    document.querySelector('.modal').classList.add('university-modal');
  }
  function detail(id, fromSearch = false) {
    detailFromSearch = fromSearch;
    const p=programIndex.get(id);if(!p)return;
    if(viewingSchool!==p.schoolId){viewingSchool=p.schoolId;collegeFilter='all';query='';}
    const s=schools.find(s=>s.id===p.schoolId);
    openModal(p.name,`<button class="degree-back" data-action="program-back">${fromSearch?'← 返回专业搜索':'← '+escapeHTML(s.name)+' · 学院与项目'}</button><div class="degree-detail-hero"><span class="eyebrow">YOUR NEXT ACADEMIC CHAPTER</span><div class="degree-detail-tags"><span>${escapeHTML(p.degree)}</span><span>${escapeHTML(p.field)}</span></div><h3>${escapeHTML(p.english)}</h3><p>${escapeHTML(p.college.name)}<br><small>${escapeHTML(p.college.english)}</small></p></div><div class="degree-detail-facts"><div><span>所属院校</span><strong>${escapeHTML(s.name)}</strong></div><div><span>目标申请季</span><strong>${state.cycleYear} Fall</strong></div><div><span>学位</span><strong>${escapeHTML(p.degree)}</strong></div><div><span>申请方式</span><strong>${p.admissionMode==='check-route'?'先核对硕士招生路径':'按当季官方要求确认'}</strong></div></div><div class="degree-check-note"><h4>定项之前，先确认这几件事。</h4><p>${escapeHTML(p.note)}</p><ul><li>课程设置与学位类型是否符合你的目标</li><li>先修课、语言成绩与材料要求</li><li>本申请季是否招生、截止时间与项目总费用</li></ul></div><div class="degree-source-line"><span>官方参考入口</span><a href="${escapeHTML(p.url)}" target="_blank" rel="noopener noreferrer">${p.sourceLevel==='program'?'项目页面':'学院 / 目录入口'} ↗</a></div><p class="disclaimer">${p.sourceEvidence?.length?`项目名称与学位按 ${escapeHTML(p.catalogueReviewedAt)} 保留的官方目录页面整理；当季招生要求仍待核验。`:'此参考条目尚未逐页核对当前官网。'}未提供未经核验的截止日期、费用或录取概率。</p><div class="modal-actions">${addButton(p)}<a class="secondary-button" href="${escapeHTML(p.url)}" target="_blank" rel="noopener noreferrer">${p.sourceLevel==='program'?'项目官网':'学院 / 目录入口'} ↗</a></div>`);
    document.querySelector('.modal').classList.add('degree-detail-modal');
  }
  function add(id) {
    const p=programIndex.get(id);if(!p || p.admissionMode==='check-route')return;
    if(selected(id)){ApplicationWorkspace.open(id);return;}
    if(!state.saved.includes(p.schoolId))state.saved.push(p.schoolId);
    state.programChoices[p.schoolId]=[...choices(p.schoolId),id];
    save();render();
    document.querySelectorAll(`[data-action="program-add"][data-id="${id}"]`).forEach(b=>{b.className='secondary-button';b.innerHTML=`${icon('check')}已加入 · 打开申请`;});
    toast('已加入当前申请季，同校不同项目分别记录');
  }
  function remove(id) {
    const p=programIndex.get(id);if(!p)return;
    state.programChoices[p.schoolId]=choices(p.schoolId).filter(pid=>pid!==id);save();closeModal();render();
    toast('已移出清单，已有文稿与项目记录仍保留',()=>{state.programChoices[p.schoolId]=[...choices(p.schoolId),id];if(!state.saved.includes(p.schoolId))state.saved.push(p.schoolId);save();render();});
  }
  function refresh() {
    document.querySelector('#degree-results').innerHTML=resultHTML();
    document.querySelector('#degree-result-count').textContent=`${matching().length} 个结果`;
  }
  function handle(action,button) {
    if(action==='program-college'){visibleLimit=24;collegeFilter=button.dataset.college;document.querySelectorAll('[data-action="program-college"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.college===collegeFilter)));refresh();}
    else if(action==='program-more'){visibleLimit+=24;refresh();}
    else if(action==='program-detail')detail(button.dataset.id,Boolean(button.closest('#cross-program-results')));
    else if(action==='program-add')add(button.dataset.id);
    else if(action==='program-remove')remove(button.dataset.id);
    else if(action==='program-back'){if(detailFromSearch){closeModal();document.querySelector('#cross-program-query')?.focus();}else open(viewingSchool,false);}
    else if(action==='program-reset'){collegeFilter='all';query='';degreeFilter=modeFilter='all';visibleLimit=24;open(viewingSchool,false);}
    else return false;
    return true;
  }
  function onInput(input) {if(input.id==='program-search'){query=input.value;visibleLimit=24;refresh();}}
  function onChange(input){if(input.id==='program-degree')degreeFilter=input.value;else if(input.id==='program-mode')modeFilter=input.value;else return;visibleLimit=24;refresh();}
  return {open, handle, onInput, onChange, items, resolve, choices, addButton, get:id=>programIndex.get(id)};
})();

// Cross-university browsing uses the retained catalogue, never inferred admissions.
const ProgramSearch = (() => {
  const groups = [
    ['computing', '计算机与信息', ['计算机', '信息管理', '信息与数据', '工程与计算机']],
    ['data', '数据与统计', ['数据与统计', '数据科学', '商科与数据', '工程与数据']],
    ['business', '商科与经济', ['商科与经济', '商科', '金融', '工程与管理']],
    ['science', '工程与自然科学', ['工程', '自然科学', '地球科学', '环境']],
    ['arts', '艺术与设计', ['艺术与设计']],
    ['education', '教育与心理', ['教育', '教育与心理']],
    ['humanities', '人文与社会科学', ['人文', '社会科学', '传播']],
    ['public', '公共与国际事务', ['公共政策', '公共与国际事务', '国际事务']],
    ['health', '健康与医学', ['健康与医学', '公共卫生']],
    ['other', '其他学科', ['其他学科']],
  ];
  const aliases = [
    ['计算机', 'computer science', 'computing'], ['金融', 'finance', 'financial'],
    ['商业分析', 'business analytics'], ['数据科学', 'data science'],
    ['统计', 'statistics', 'statistical'], ['经济', 'economics', 'economic'],
    ['心理', 'psychology', 'psychological'], ['教育', 'education'],
    ['工程', 'engineering'], ['公共卫生', 'public health'],
  ];
  const schoolById = new Map(SchoolCatalog.schools.map(s => [s.id, s]));
  const entries = (SchoolCatalog.programDirectory?.schools || []).flatMap(entry =>
    entry.colleges.flatMap(college => college.programs.map(program => {
      const school = schoolById.get(entry.schoolId);
      const category = groups.find(([, , fields]) => fields.includes(program.field))?.[0] || 'other';
      return { program, college, school, category,
        text: [school.name, school.english, school.wordmark, program.name, program.english,
          program.degree, program.field, college.name, college.english].join(' ').toLocaleLowerCase() };
    }))
  ).sort((a, b) => (a.school.rankNumber ?? Infinity) - (b.school.rankNumber ?? Infinity)
    || (a.school.rankingSourceOrder ?? Infinity) - (b.school.rankingSourceOrder ?? Infinity)
    || a.school.english.localeCompare(b.school.english) || a.program.english.localeCompare(b.program.english));
  let query = '', category = 'all', school = 'all', degree = 'all', limit = 24;
  const degrees = [...new Set(entries.map(e => e.program.degree))].sort();
  function baseMatches() {
    const terms = query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
    return entries.filter(entry => (school === 'all' || entry.school.id === school)
      && (degree === 'all' || entry.program.degree === degree)
      && terms.every(term => entry.text.includes(term)
        || aliases.some(set => set.includes(term) && set.some(alias => entry.text.includes(alias)))));
  }
  const matches = base => base.filter(entry => category === 'all' || entry.category === category);
  function cards(results) {
    if (!results.length) return `<div class="cross-program-empty">${icon('search')}<h2>暂时没有找到匹配专业</h2><p>试试其他关键词，或清空学校与专业分类筛选。</p><button class="secondary-button" data-action="cross-program-reset">清空筛选</button></div>`;
    return results.slice(0, limit).map(({ program:p, college, school }) => {
      const translated = p.name.toLocaleLowerCase() !== p.english.toLocaleLowerCase();
      return `<article class="cross-program-card" data-school-id="${school.id}" data-program="${p.id}">
        <div class="cross-program-school"><button data-action="school" data-id="${school.id}" aria-label="查看${escapeHTML(school.name)}院校资料">${schoolLogo(school)}<span><strong>${escapeHTML(school.name)}</strong><small>${escapeHTML(school.location)}</small></span></button></div>
        <div class="cross-program-main"><div class="cross-program-meta"><span class="degree-type">${escapeHTML(p.degree)}</span><span class="degree-field">${escapeHTML(p.field)}</span><span class="cross-program-evidence" title="${p.sourceEvidence?.length?'名称与学位有官网目录依据，当季招生要求仍需核验':'参考条目，名称与当季招生要求待进一步核对'}">${p.sourceEvidence?.length?'有目录依据':'资料待核对'}</span></div><button class="degree-title" data-action="program-detail" data-id="${p.id}"><h3>${escapeHTML(p.name)}</h3></button>${translated?`<p class="cross-program-english">${escapeHTML(p.english)}</p>`:''}<p class="cross-program-college">${escapeHTML(college.name)}</p>${p.admissionMode==='check-route'?'<p class="degree-route-note">需先确认独立硕士招生路径</p>':''}</div>
        <div class="cross-program-actions">${ProgramWorkspace.addButton(p)}<button class="degree-more" data-action="program-detail" data-id="${p.id}">了解项目 ${icon('arrow')}</button></div>
      </article>`;
    }).join('');
  }
  function page() {
    const base = baseMatches(), results = matches(base);
    return `${heading('专业搜索','按专业方向筛选，跨学校比较。','PROGRAM FINDER')}
      <section class="cross-program-toolbar" aria-label="跨校专业搜索"><label class="cross-program-query">${icon('search')}<input id="cross-program-query" aria-label="搜索跨校专业" placeholder="搜索专业、方向或学校" value="${escapeHTML(query)}" maxlength="160" autocomplete="off"></label><div class="cross-program-filters"><label class="cross-filter-label">学校<select id="cross-program-school" aria-label="筛选专业所属学校"><option value="all">全部学校</option>${[...schoolById.values()].sort((a,b)=>a.name.localeCompare(b.name,'zh-CN')).map(s=>`<option value="${s.id}" ${school===s.id?'selected':''}>${escapeHTML(s.name)}</option>`).join('')}</select></label><label class="cross-filter-label">学位<select id="cross-program-degree" aria-label="筛选跨校专业学位"><option value="all">全部学位</option>${degrees.map(value=>`<option value="${escapeHTML(value)}" ${degree===value?'selected':''}>${escapeHTML(value)}</option>`).join('')}</select></label><button class="text-button" data-action="cross-program-reset">清空筛选</button><span class="cross-program-hint">输入即搜索 · 支持中英文</span></div></section>
      <div class="cross-program-layout"><aside class="cross-program-categories" aria-label="专业分类"><div class="cross-program-category-title">按专业分类</div>${[['all','全部专业'],...groups].map(([id,name])=>`<button data-action="cross-program-category" data-category="${id}" aria-pressed="${category===id}" ${id!=='all'&&id!==category&&!base.some(e=>e.category===id)?'disabled':''}><span>${name}</span><b>${id==='all'?base.length:base.filter(e=>e.category===id).length}</b></button>`).join('')}<p>${entries.length.toLocaleString()} 个项目与方向<br>${schoolById.size} 份院校档案</p></aside><section class="cross-program-results" aria-label="跨校专业结果"><div class="cross-program-summary"><strong id="cross-program-count" role="status">${results.length} 个专业 · ${new Set(results.map(e=>e.school.id)).size} 所学校</strong><span class="cross-program-sort-note">按院校排名排序</span><button class="text-button cross-program-mobile-reset" data-action="cross-program-reset">清空筛选</button></div><p class="cross-program-scope">目录持续补充；项目名称与分类不代表当季招生资格已核验。</p><div id="cross-program-results" class="cross-program-grid">${cards(results)}</div><button class="secondary-button cross-program-more" data-action="cross-program-more" ${results.length<=limit?'hidden':''}>继续加载专业</button><p id="cross-program-progress" class="cross-program-progress">已展示 ${Math.min(limit,results.length)} / ${results.length} 个专业</p></section></div>`;
  }
  function refresh() {
    const root = document.querySelector('#cross-program-results');
    if (!root) return;
    const base = baseMatches(), results = matches(base);
    root.innerHTML = cards(results);
    document.querySelector('#cross-program-count').textContent = `${results.length} 个专业 · ${new Set(results.map(e=>e.school.id)).size} 所学校`;
    document.querySelector('#cross-program-progress').textContent = `已展示 ${Math.min(limit,results.length)} / ${results.length} 个专业`;
    document.querySelector('[data-action="cross-program-more"]').hidden = results.length <= limit;
    document.querySelectorAll('[data-action="cross-program-category"]').forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.category===category));
      button.disabled = button.dataset.category!=='all' && button.dataset.category!==category && !base.some(e=>e.category===button.dataset.category);
      button.querySelector('b').textContent = button.dataset.category==='all'?base.length:base.filter(e=>e.category===button.dataset.category).length;
    });
    hydrateIcons(root);
  }
  function handle(action, button) {
    if (action === 'cross-program-category') { category=button.dataset.category; limit=24; refresh(); }
    else if (action === 'cross-program-more') { limit+=24; refresh(); }
    else if (action === 'cross-program-reset') {
      query=''; category=school=degree='all'; limit=24; render();
      document.querySelector('#cross-program-query').focus();
    } else return false;
    return true;
  }
  function onInput(input) { if (input.id==='cross-program-query') { query=input.value; limit=24; refresh(); } }
  function onChange(input) {
    if (input.id==='cross-program-school') school=input.value;
    else if (input.id==='cross-program-degree') degree=input.value;
    else return;
    limit=24; refresh();
  }
  return { render:page, handle, onInput, onChange, total:entries.length };
})();

// Loaded before app.js in both the regular app and the standalone preview.
// App state is read only when a workspace method is called.
const WritingWorkspace = (() => {
  let versionSequence = 0;

  const getDocument = (id = activeDoc) => documents.find(doc => doc.id === id) || documents[0];
  const getValue = doc => String(state.drafts[doc.id] ?? doc.initial);
  const currentValue = doc => {
    const editor = document.querySelector('#document-editor');
    return editor && doc.id === activeDoc ? editor.value : getValue(doc);
  };
  const getVersions = id => Array.isArray(state.versions?.[id])
    ? state.versions[id].filter(item => item && typeof item.id === 'string' && typeof item.content === 'string')
    : [];

  function measure(value) {
    const text = value.trim();
    return {
      characters: value.replace(/\s/g, '').length,
      words: (value.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g) || []).length,
      paragraphs: text ? text.split(/\n\s*\n/).filter(part => part.trim()).length : 0,
      placeholders: (value.match(/\[[^\]\n]+\]|【[^】\n]+】/g) || []).length,
    };
  }

  function saveStatus() {
    return typeof storageAvailable !== 'undefined' && !storageAvailable
      ? '未保存，请导出备份'
      : '内容自动保存在此浏览器';
  }

  function steps(doc, value) {
    const stats = measure(value);
    const started = value.trim().length > 0 && value !== doc.initial;
    return [
      {title: '留下真实的素材', detail: '先写清楚经历，再寻找表达。', done: started},
      {title: '把故事慢慢展开', detail: '补全模板，连接行动与收获。', done: started && !stats.placeholders && stats.characters >= 80},
      {title: '留住一个好版本', detail: '手动保存节点，随时回看。', done: getVersions(doc.id).length > 0},
    ];
  }

  function progressHTML(doc, value) {
    return steps(doc, value).map((step, index) => `<div class="writing-step ${step.done ? 'is-complete' : ''}"><b>${step.done ? '✓' : String(index + 1).padStart(2, '0')}</b><div><strong>${step.title}</strong><span>${step.detail}</span></div></div>`).join('');
  }

  function renderWorkspace() {
    const doc = getDocument();
    const value = getValue(doc);
    const stats = measure(value);
    const focused = document.body.classList.contains('focus-mode');
    return `${heading('写下你的申请故事', '从一段真实经历开始，慢慢写出属于自己的答案。', 'A SPACE FOR YOUR OWN WORDS', `<button class="secondary-button focus-button" data-action="focus-writing" aria-pressed="${focused}">${icon(focused ? 'close' : 'focus')}${focused ? '退出专注' : '专注写作'}</button>`)}
      ${doc.schoolId?`<div class="document-project-context"><span>${escapeHTML(doc.subtitle)}</span><button class="text-button" data-action="application-detail" data-id="${doc.applicationId || doc.schoolId}">返回项目申请 ↗</button></div>`:''}
      <div class="document-layout">
        <aside class="document-list" aria-label="文书列表">
          ${documents.map((item, index) => `<button class="document-card ${doc.id === item.id ? 'active' : ''}" data-action="select-doc" data-id="${escapeHTML(item.id)}" aria-pressed="${doc.id === item.id}"><div class="document-card-top">${icon('document')}<span>0${index + 1}</span></div><h3>${escapeHTML(item.name)}</h3><p>${escapeHTML(item.subtitle)}</p><div class="document-card-bottom"><span>${escapeHTML(item.label)}</span><span>${Object.prototype.hasOwnProperty.call(state.drafts, item.id) ? '草稿已编辑' : '从这里开始'} ↗</span></div></button>`).join('')}
          <section class="writing-tips"><div class="eyebrow">A LITTLE WRITING RITUAL</div><h3>好故事，一步步写成。</h3><div id="writing-progress">${progressHTML(doc, value)}</div></section>
        </aside>
        <section class="editor" aria-label="文书编辑区">
          <div class="editor-top"><div class="editor-title-meta"><span class="eyebrow">${escapeHTML(doc.label)} · YOUR DRAFT</span><h2>${escapeHTML(doc.name)}</h2><p>${escapeHTML(doc.subtitle)}</p></div><span class="save-status" id="save-status" role="status">${saveStatus()}</span></div>
          <div class="editor-tools"><div class="editor-tool-group"><button class="primary-button gpt-writing-button" data-action="gpt-document">${icon('spark')}与 GPT 打磨</button><button class="secondary-button" data-action="save-version">${icon('plus')}保存版本</button><button class="secondary-button" data-action="version-history" aria-label="查看历史版本">${icon('clock')}查看历史版本<span id="version-count">${getVersions(doc.id).length ? ` · ${getVersions(doc.id).length}` : ''}</span></button></div><button class="secondary-button" data-action="writing-check">${icon('check')}写作检查</button></div>
          <div class="editor-prompt"><span>${icon('spark')}写作小提示</span><p>${escapeHTML(doc.prompt)}</p></div>
          <div class="document-meta"><span>PRIVATE DRAFT · 仅此浏览器</span><span id="paragraph-count">${stats.paragraphs} 段内容</span></div>
          <textarea id="document-editor" aria-label="${escapeHTML(doc.name)}编辑器" spellcheck="false" placeholder="把光标放在这里，开始你的故事…">${escapeHTML(value)}</textarea>
          <div class="editor-bottom"><span id="word-count">${wordCount(value)}</span><button class="secondary-button" data-action="export">${icon('download')}导出文稿</button></div>
        </section>
      </div><p class="profile-note">草稿和版本保存在当前浏览器。定期导出一份，让认真写下的每一句话都有备份。</p>`;
  }

  function updateSaveStatus(persisted) {
    const status = document.querySelector('#save-status');
    if (status) status.textContent = persisted ? '✓ 已保存到此浏览器' : '未保存，请导出备份';
  }

  function onInput(textarea) {
    const doc = getDocument();
    state.drafts[doc.id] = textarea.value;
    updateSaveStatus(save());
    const count = document.querySelector('#word-count');
    const paragraphs = document.querySelector('#paragraph-count');
    const progress = document.querySelector('#writing-progress');
    if (count) count.textContent = wordCount(textarea.value);
    if (paragraphs) paragraphs.textContent = `${measure(textarea.value).paragraphs} 段内容`;
    if (progress) progress.innerHTML = progressHTML(doc, textarea.value);
  }

  function addVersion(doc, content) {
    const snapshot = {
      id: `draft-${Date.now()}-${++versionSequence}`,
      date: new Date().toISOString(),
      content,
    };
    if (!state.versions || typeof state.versions !== 'object' || Array.isArray(state.versions)) state.versions = {};
    state.versions[doc.id] = [snapshot, ...getVersions(doc.id)].slice(0, 12);
    return snapshot;
  }

  function formattedDate(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? '时间未记录' : date.toLocaleString('zh-CN', {
      timeZone: 'Asia/Shanghai', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    });
  }

  function showHistory() {
    const doc = getDocument();
    const history = getVersions(doc.id);
    openModal('文书版本', `<p>${escapeHTML(doc.name)} · ${history.length} 个已保存版本</p><div class="draft-history">${history.length ? history.map((version, index) => `<article class="draft-history-item"><div class="draft-history-heading"><strong>${index === 0 ? '最近保存' : `历史版本 ${history.length - index}`}</strong><time>${escapeHTML(formattedDate(version.date))}</time></div><p>${escapeHTML(version.content.slice(0, 130) || '空白文稿')}${version.content.length > 130 ? '…' : ''}</p><div class="draft-history-bottom"><span>${escapeHTML(wordCount(version.content))}</span><button class="secondary-button" data-action="restore-version" data-id="${escapeHTML(doc.id)}" data-version="${escapeHTML(version.id)}">恢复此版本</button></div></article>`).join('') : '<div class="empty-state">还没有保存过版本。<br>写到一个满意的节点，点击「保存版本」。</div>'}</div><p class="disclaimer">最多保留最近 12 个手动版本。恢复前会保留当前内容；版本也只保存在当前浏览器。</p>`);
  }

  function showCheck() {
    const doc = getDocument();
    const value = currentValue(doc);
    const stats = measure(value);
    const checks = [
      {done: Boolean(value.trim()), title: '内容已开始', detail: value.trim() ? `${stats.characters} 个非空白字符，${stats.words} 个英文词。` : '先写下一段经历，哪怕只有一句话。'},
      {done: stats.placeholders === 0, title: '模板占位符', detail: stats.placeholders ? `发现 ${stats.placeholders} 处方括号占位内容，提交前请替换成真实信息。` : '未发现方括号占位内容。'},
      {done: stats.paragraphs > 1, title: '段落结构', detail: stats.paragraphs > 1 ? `当前有 ${stats.paragraphs} 段内容，可以逐段核对每段的作用。` : '可以使用空行分段，让经历、行动与思考更容易阅读。'},
    ];
    openModal('写作检查', `<p>${escapeHTML(doc.name)}</p>${checks.map(check => `<div class="guide-step"><b>${check.done ? '✓' : '·'}</b><div><h3>${check.title}</h3><p>${escapeHTML(check.detail)}</p></div></div>`).join('')}<p class="disclaimer">这是本地格式检查。请另外核对项目正式题目、字数上限，以及每段经历和成果的真实性。</p><div class="modal-actions"><button class="primary-button" data-action="close-modal">继续写作 ${icon('arrow')}</button></div>`);
  }

  function handle(action, button) {
    if (action === 'select-doc') {
      if (documents.some(doc => doc.id === button.dataset.id)) {activeDoc = button.dataset.id; state.activeDocumentId = activeDoc; save();}
      render();
      return true;
    }
    if (action === 'focus-writing') {
      const editor = document.querySelector('#document-editor');
      const cursor = editor?.selectionStart || 0;
      document.body.classList.toggle('focus-mode');
      render();
      const nextEditor = document.querySelector('#document-editor');
      nextEditor?.focus({preventScroll: true});
      nextEditor?.setSelectionRange(cursor, cursor);
      return true;
    }
    if (action === 'save-version') {
      const doc = getDocument();
      const value = currentValue(doc);
      state.drafts[doc.id] = value;
      addVersion(doc, value);
      const persisted = save();
      render();
      updateSaveStatus(persisted);
      toast(persisted ? '已保存一个新版本，随时可以回来看看' : '版本暂存于本次页面，请导出备份');
      return true;
    }
    if (action === 'version-history') {
      showHistory();
      return true;
    }
    if (action === 'restore-version') {
      const doc = getDocument(button.dataset.id);
      const version = getVersions(doc.id).find(item => item.id === button.dataset.version);
      if (!version) { toast('没有找到这个版本，请重新打开版本记录'); return true; }
      addVersion(doc, currentValue(doc));
      state.drafts[doc.id] = version.content;
      activeDoc = doc.id;
      state.activeDocumentId = activeDoc;
      const persisted = save();
      closeModal();
      render();
      updateSaveStatus(persisted);
      toast(persisted ? '已恢复版本，恢复前的内容也已保留' : '已恢复版本，请导出备份');
      return true;
    }
    if (action === 'writing-check') {
      showCheck();
      return true;
    }
    if (action === 'export') {
      const doc = getDocument();
      const content = currentValue(doc);
      const url = URL.createObjectURL(new Blob([content], {type: 'text/plain;charset=utf-8'}));
      const link = document.createElement('a');
      link.href = url;
      link.download = `Gradpath-${doc.name}-${doc.subtitle}-${state.cycleYear}Fall.txt`.replace(/[\\/:*?"<>|]/g,'-');
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('文稿已导出为 TXT 文件');
      return true;
    }
    return false;
  }

  return {render: renderWorkspace, handle, onInput};
})();

// Project workspaces share the app's state, but keep each school's records separate.
const ApplicationWorkspace = (() => {
  const materials = ['成绩单与学位材料', '语言与其他考试成绩', '个人简历', '个人陈述 / 文书', '推荐信', '其他项目要求'];
  const validSchool = id => ProgramWorkspace.items().find(s=>s.id===id) || (state.projectDocuments.includes(id)?ProgramWorkspace.resolve(id):undefined);
  function record(id) {
    if (!state.applicationDetails[id] || typeof state.applicationDetails[id] !== 'object') state.applicationDetails[id] = {};
    return state.applicationDetails[id];
  }
  function prepareDocument(id) {
    const school = ProgramWorkspace.resolve(id);
    if (!school) return null;
    const docId = `sop-${id}`;
    if (!documents.some(d => d.id === docId)) documents.push({
      id: docId, schoolId: school.schoolId || id, applicationId: id, name: 'Statement of Purpose', label: '项目个人陈述',
      subtitle: `${school.name} · ${record(id).projectName || school.program}${school.collegeName?' · '+school.collegeName:''}`,
      prompt: '先在项目官网核对正式文书题目和字数，再用真实经历组织回答。这里提供通用写作提纲。',
      initial: '申请动机\n\n[用真实经历说明你的学术兴趣。]\n\n学术与实践准备\n\n[写清楚问题、你的行动和可核实的成果。]\n\n为什么选择这个项目\n\n[核对课程与研究资源，说明它们与你目标的联系。]\n\n未来计划\n\n[写下你希望继续探索的方向。]',
    });
    return docId;
  }
  function open(id, tab = 'overview') {
    const school = validSchool(id); if (!school) return;
    const data = record(id);
    const completed = Array.isArray(data.materials) ? data.materials : [];
    const tabs = [['overview','项目详情'],['materials','材料清单'],['submission','提交核对'],['tracking','结果跟踪']];
    if (!tabs.some(([key]) => key === tab)) tab = 'overview';
    let body;
    if (tab === 'overview') body = `<form data-form="application" data-id="${id}" class="application-form"><label class="form-field">申请项目<input name="projectName" value="${escapeHTML(data.projectName || school.program)}" maxlength="150" required></label><label class="form-field">项目申请入口<input name="portalURL" type="url" placeholder="https://…" value="${escapeHTML(data.portalURL || '')}" maxlength="1000"></label><label class="form-field">申请笔记<textarea name="notes" rows="4" maxlength="5000" placeholder="记录项目要求、截止日期与下一步">${escapeHTML(data.notes || '')}</textarea></label><button class="primary-button" type="submit">保存项目资料 ${icon('check')}</button></form>`;
    if (tab === 'materials' || tab === 'submission') body = `<p>${tab === 'submission'?'提交前，再逐项核对一次。':'把需要准备的材料，逐项整理好。'}</p><p class="disclaimer">通用准备清单，可勾选的条目用于个人记录。具体要求、豁免条件与截止时间以项目官网为准。</p><div class="material-checklist">${materials.map((name,i)=>`<label><input type="checkbox" data-material="${i}" data-id="${id}" ${completed.includes(i)?'checked':''}><span>${name}</span>${i===3?`<button type="button" class="text-button" data-action="application-write" data-id="${id}">去写作 ↗</button>`:''}</label>`).join('')}</div><div class="application-progress" role="status">已整理 <strong id="material-count">${completed.length}</strong> / ${materials.length} 项</div>${tab==='submission'?'<p class="disclaimer">勾选仅记录本地准备进度。请到项目官方申请系统上传、付费并确认提交。</p>':''}`;
    if (tab === 'tracking') body = `<form data-form="application-tracking" data-id="${id}" class="application-form"><p>记录官方系统的通知，随时回来更新。</p><label class="form-field">结果记录<select name="result">${['等待通知','面试邀请','录取','候补','未录取','其他'].map(value=>`<option ${data.result===value?'selected':''}>${value}</option>`).join('')}</select></label><label class="form-field">跟进备注<textarea name="trackingNotes" rows="4" maxlength="5000" placeholder="记录通知日期、后续安排或需要确认的事情">${escapeHTML(data.trackingNotes || '')}</textarea></label><button class="primary-button" type="submit">保存跟踪记录 ${icon('check')}</button></form>`;
    const portal = safePortal(data.portalURL);
    openModal(`${school.name} · ${school.programId?school.programName+' · ':''}申请详情`, `<div class="application-context"><span class="eyebrow">YOUR APPLICATION</span><p>${escapeHTML(data.projectName || school.program)}</p>${school.collegeName?`<small>${escapeHTML(school.collegeName)}</small>`:''}<span class="phase-chip">${escapeHTML(state.statuses[id] || school.status)}</span></div><div class="application-tabs" role="tablist" aria-label="申请工作区">${tabs.map(([key,title])=>`<button role="tab" aria-selected="${key===tab}" data-action="application-tab" data-id="${id}" data-tab="${key}">${title}</button>`).join('')}</div><div class="application-panel" role="tabpanel">${body}</div><div class="modal-actions"><button class="secondary-button" data-action="application-write" data-id="${id}">${icon('document')}打开项目文书</button><a class="secondary-button" href="${escapeHTML(portal || (school.programId?school.url:school.homepage))}" target="_blank" rel="noopener noreferrer">${portal?'官方申请入口':school.programId?'官方项目参考入口':'学校官网'} ↗</a><button class="secondary-button" data-action="school" data-id="${school.schoolId || school.id}">查看学院与项目</button>${school.programId?`<button class="text-button program-remove-button" data-action="program-remove" data-id="${id}">移出此项目</button>`:''}</div><p class="profile-note">个人记录保存在此浏览器。</p>`);
  }
  function safePortal(value) {
    try { const url = new URL(value); return url.protocol === 'https:' ? url.href : ''; } catch { return ''; }
  }
  function write(id) {
    if (!validSchool(id)) return;
    const docId = prepareDocument(id);
    if (!state.projectDocuments.includes(id)) state.projectDocuments.push(id);
    activeDoc = docId; state.activeDocumentId = docId; save(); closeModal(); goTo('documents');
  }
  function enter(id) {
    const school = validSchool(id); if (!school) return;
    const stage = state.statuses[id] || school.status;
    if (stage === '文书撰写') { write(id); return; }
    open(id, {'准备材料':'materials','准备提交':'submission','已提交':'tracking','收到结果':'tracking'}[stage] || 'overview');
  }
  function handle(action, button) {
    const id = button.dataset.id;
    if (action === 'application-detail') open(id);
    else if (action === 'application-enter') enter(id);
    else if (action === 'application-write') write(id);
    else if (action === 'application-tab') open(id, button.dataset.tab);
    else return false;
    return true;
  }
  function onChange(input) {
    if (!input.hasAttribute('data-material') || !validSchool(input.dataset.id)) return;
    const data = record(input.dataset.id);
    const index = Number(input.dataset.material);
    const checked = Array.isArray(data.materials) ? data.materials.filter(i => i !== index) : [];
    if (input.checked) checked.push(index);
    data.materials = checked; save();
    document.querySelector('#material-count').textContent = checked.length;
  }
  function onSubmit(form, values) {
    if (!['application','application-tracking'].includes(form.dataset.form)) return false;
    const id = form.dataset.id; if (!validSchool(id)) return true;
    const data = record(id);
    if (form.dataset.form === 'application') {
      const portal = String(values.get('portalURL') || '').trim();
      if (portal && !safePortal(portal)) { toast('申请入口请填写 HTTPS 链接'); return true; }
      Object.assign(data, {projectName:String(values.get('projectName') || '').trim().slice(0,150), portalURL:portal, notes:String(values.get('notes') || '').slice(0,5000)});
      const doc = documents.find(d => (d.applicationId || d.schoolId) === id);
      if (doc) doc.subtitle = `${validSchool(id).name} · ${data.projectName}${validSchool(id).collegeName?' · '+validSchool(id).collegeName:''}`;
    } else Object.assign(data, {result:String(values.get('result')), trackingNotes:String(values.get('trackingNotes') || '').slice(0,5000)});
    const persisted = save();
    render();
    if (form.dataset.form === 'application') open(id);
    toast(persisted?'项目记录已保存在此浏览器':'记录已更新，请保留备份');
    return true;
  }
  return {prepareDocument, open, enter, handle, onChange, onSubmit};
})();

// Editorial discovery lists are starting points for research, not admissions predictions.
const ShortlistWorkspace = (() => {
  const directions = [
    {name:'计算机与数据', pattern:/计算机|软件|人工智能|机器学习|数据|computer|software|\bcs\b|\bai\b|data|information/i, schools:['stanford','mit','cmu','berkeley','umich','columbia','georgia-tech','uiuc','nyu','ucsd','maryland','northeastern']},
    {name:'工程与理科', pattern:/工程|机械|电子|电气|物理|化学|数学|engineering|physics|chemistry|math/i, schools:['mit','caltech','stanford','berkeley','umich','cornell','georgia-tech','uiuc','ucsd','wisconsin','maryland','case-western']},
    {name:'商科与经济', pattern:/商科|金融|管理|经济|会计|市场|business|finance|management|economics|accounting|marketing/i, schools:['upenn','mit','northwestern','columbia','uchicago','nyu','umich','berkeley','usc','boston-college','bu','rochester','villanova']},
    {name:'教育与社会科学', pattern:/教育|心理|社会|公共|政策|education|psychology|social|public|policy/i, schools:['harvard','stanford','upenn','northwestern','columbia','vanderbilt','umich','berkeley','nyu','wisconsin','bu','maryland','ohio-state']},
    {name:'人文与传播', pattern:/人文|历史|文学|语言|传媒|传播|新闻|艺术|设计|humanities|history|literature|communication|media|journalism|design/i, schools:['yale','harvard','northwestern','upenn','columbia','uchicago','nyu','usc','berkeley','bu','wisconsin','ucsb']},
    {name:'生命与健康', pattern:/生物|生命|健康|医学|护理|biology|biomedical|health|medicine|nursing/i, schools:['johns-hopkins','harvard','duke','upenn','stanford','washu','emory','unc','ucsd','uc-davis','case-western','rochester']},
  ];
  function preferences() {
    const stored = state.shortlistPreferences || {};
    return {tier:['all','10','30','50'].includes(stored.tier)?stored.tier:'all', control:['all','公立','私立'].includes(stored.control)?stored.control:'all'};
  }
  function suggest() {
    const major = String(state.profile.major || '').trim();
    const direction = directions.find(d => d.pattern.test(major));
    const pref = preferences();
    const candidates = rankedSchools.filter(s => (pref.tier==='all' || s.tier===pref.tier) && (pref.control==='all' || s.control===pref.control));
    const order = direction?.schools || [];
    const prioritized = [...candidates].sort((a,b) => {
      const ai = order.indexOf(a.id), bi = order.indexOf(b.id);
      return (ai<0?1000:ai)-(bi<0?1000:bi) || a.rankNumber-b.rankNumber || a.rankingSourceOrder-b.rankingSourceOrder;
    });
    const groups = [['10','高位探索','TOP 10'],['30','拓展比较','TOP 11–30'],['50','补充考察','TOP 31–50']].filter(([key])=>pref.tier==='all'||key===pref.tier).map(([key,title,range])=>({key,title,range,schools:prioritized.filter(s=>s.tier===key).slice(0,pref.tier==='all'?2:6)}));
    return {direction,groups,major};
  }
  function card(s, direction) {
    const curated = direction?.schools.includes(s.id);
    const saved = state.saved.includes(s.id);
    return `<article class="recommendation-card"><div class="recommendation-card-top">${schoolLogo(s)}<span class="rank-badge">${escapeHTML(s.rank)}</span></div><button class="recommendation-school" data-action="school" data-id="${s.id}"><h4>${escapeHTML(s.name)}</h4><span>${escapeHTML(s.english)}</span></button><div class="recommendation-meta">${escapeHTML(s.location)} · ${s.control}大学</div><p class="recommendation-reason">${curated?`${escapeHTML(direction.name)}方向的人工探索清单，建议先查课程与学位类型。`:'按所选排名区间补充比较，专业适配度尚待核验。'}</p><div class="recommendation-actions"><button class="${saved?'shortlist-saved':'shortlist-add'}" data-action="bookmark" data-id="${s.id}" aria-label="${saved?'移除':'加入'}${s.name}申请" aria-pressed="${saved}">${icon(saved?'check':'plus')}${saved?'已加入申请':'加入我的申请'}</button><button class="compare-toggle" data-action="compare-toggle" data-id="${s.id}" aria-label="对比${s.name}" aria-pressed="${comparisonIds.includes(s.id)}">${icon('compare')}${comparisonIds.includes(s.id)?'已选对比':'对比'}</button></div></article>`;
  }
  function render() {
    if (!state.profileSaved) return `<section class="shortlist-teaser"><span class="eyebrow">NEXT · BUILD YOUR SHORTLIST</span><h2>下一步，找到想去的地方。</h2><p>保存档案后，在这里查看选校建议，再把值得深入了解的学校加入申请。</p></section>`;
    const {direction,groups,major} = suggest();
    const pref = preferences();
    return `<section class="shortlist-section" id="shortlist-section" aria-label="选校建议"><div class="shortlist-heading"><div><span class="eyebrow">FROM YOUR PROFILE TO YOUR NEXT CHAPTER</span><h2 tabindex="-1" id="shortlist-title">从你的背景，到你的选校清单。</h2><p>先探索，再比较，慢慢确定适合自己的申请目标。</p></div><span class="shortlist-method">本地规则初筛</span></div><div class="shortlist-profile-summary"><span>${icon('user')}本次使用的档案</span>${[['目标方向',major||'待补充'],['GPA',state.profile.gpa||'待补充'],['语言',state.profile.language||'待补充'],['预算',state.profile.budget||'待补充']].map(([title,value])=>`<span><b>${title}</b>${escapeHTML(value)}</span>`).join('')}</div>${major?`<div class="shortlist-filters"><label>排名范围<select data-shortlist-filter="tier" aria-label="建议排名范围">${[['all','跨区间探索'],['10','Top 10'],['30','Top 11–30'],['50','Top 31–50']].map(([key,title])=>`<option value="${key}" ${pref.tier===key?'selected':''}>${title}</option>`).join('')}</select></label><label>学校性质<select data-shortlist-filter="control" aria-label="建议学校性质">${[['all','公立 + 私立'],['公立','公立大学'],['私立','私立大学']].map(([key,title])=>`<option value="${key}" ${pref.control===key?'selected':''}>${title}</option>`).join('')}</select></label><span>${direction?`探索方向：${escapeHTML(direction.name)}`:'方向尚待细化，先按排名区间探索'}</span></div><p class="shortlist-basis">推荐依据：${direction?'优先展示人工整理的方向探索院校，':'暂未识别到对应方向清单，'}按所选排名范围和学校性质筛选；各区间内按探索清单顺序、再按 PDF 名次排列。GPA、语言和预算用于下方核验提醒，尚未参与适配判断。</p><div class="shortlist-groups">${groups.map(group=>`<section class="shortlist-group"><div class="shortlist-group-title"><h3>${group.title}</h3><span>${group.range}</span></div>${group.schools.length?group.schools.map(s=>card(s,direction)).join(''):'<p class="shortlist-empty">当前区间没有符合条件的院校，试试调整学校性质或排名范围。</p>'}</section>`).join('')}</div>`:`<div class="shortlist-empty"><h3>先告诉我们，你想读什么。</h3><p>补充上方“目标专业”并再次保存，便可以开始选校探索。</p><button class="secondary-button" data-action="shortlist-edit">补充目标专业 ${icon('arrow')}</button></div>`}<div class="shortlist-verification"><h3>${icon('check')}定校之前，还差这几步。</h3><div>${[['课程与学位','核对具体硕士项目、课程设置、先修课与职业方向。'],['学术与语言',`${state.profile.gpa?'已记录 GPA；':'GPA 待补充；'}${state.profile.language?'已记录语言情况。':'语言情况待补充。'}逐个核对项目门槛、考试要求和豁免条件。`],['总成本与时间',`${state.profile.budget?'已记录预算，':'预算待补充，'}还需核对学费、生活费、奖学金及 2027 项目截止时间。`]].map(([title,text])=>`<div><strong>${title}</strong><p>${escapeHTML(text)}</p></div>`).join('')}</div></div><p class="shortlist-disclaimer">方向清单由人工整理，仅供发现院校，尚未逐项目核验。排名来自用户提供的 2027 PDF；区间不代表录取难度，也不构成冲刺、匹配或保底判断。</p><div class="shortlist-footer"><a class="secondary-button" href="#schools">查看完整资料库 ${icon('arrow')}</a><a class="primary-button" href="#applications">整理我的申请 ${icon('arrow')}</a></div></section>`;
  }
  function show() {
    document.querySelector('#shortlist-section')?.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});
    document.querySelector('#shortlist-title')?.focus({preventScroll:true});
  }
  function onChange(input) {
    const key = input.dataset.shortlistFilter;
    if (!['tier','control'].includes(key)) return;
    state.shortlistPreferences = {...preferences(),[key]:input.value};save();
    const section = document.querySelector('#shortlist-section');
    section.outerHTML = render();
    document.querySelector(`[data-shortlist-filter="${key}"]`)?.focus({preventScroll:true});
  }
  function handle(action) {
    if (action !== 'shortlist-edit') return false;
    document.querySelector('[name="major"]')?.focus();
    return true;
  }
  return {render, show, onChange, handle};
})();

// The profile is shared; application lists, drafts and reviews belong to one season.
const SeasonWorkspace = (() => {
  const fields = ['saved','completed','drafts','statuses','customTasks','versions','applicationDetails','projectDocuments','activeDocumentId','cycleReview','programChoices'];
  const currentYear = new Date().getFullYear();
  const validYear = value => Number.isInteger(Number(value)) && Number(value)>=2000 && Number(value)<=2100;
  function phase(year = state.cycleYear) { return year<=currentYear?'申请复盘':year===currentYear+1?'进行中':'提前准备'; }
  function open() {
    const years = [...new Set([2026,2027,2028,state.cycleYear,...Object.keys(state.cycleArchives).map(Number)])].filter(validYear).sort((a,b)=>a-b);

  return {phase, open, sync, overview, handle, onSubmit};
})();

/* Progressive decoration: readable without animation, quiet when requested. */
const VisualMotion = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const pointer = matchMedia('(hover: hover) and (pointer: fine)');
  const animations = new Set();
  let observer;
  let frame = 0;
  let currentCard;
  let currentHero;
  const enabled = () => !reduced.matches;
  function resetPointer() {
    cancelAnimationFrame(frame);
    frame = 0;
    for (const [element, properties] of [
      [currentCard, ['--tilt-x', '--tilt-y']],
      [currentHero, ['--scene-x', '--scene-y']],
    ]) properties.forEach(property => element?.style.removeProperty(property));
    currentCard = currentHero = null;
  }
  function sync() {
    document.documentElement.dataset.motion = enabled() ? 'playing' : 'paused';
    if (!enabled()) {
      observer?.disconnect();
      animations.forEach(animation => animation.cancel());
      resetPointer();
    }
  }
  function reveal(root) {
    observer?.disconnect();
    animations.forEach(animation => animation.cancel());
    resetPointer();
    if (!enabled() || !('IntersectionObserver' in window)) return;
    observer = new IntersectionObserver(entries => {
      if (!enabled()) return;
      let index = 0;
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        // No hidden CSS state: a failed script can never hide application content.
        const animation = entry.target.animate?.([
          { opacity: .35, translate: '0 18px' },
          { opacity: 1, translate: '0 0' },
        ], { duration: 560, delay: Math.min(index++ * 55, 220), easing: 'cubic-bezier(.16,1,.3,1)' });
        if (animation) {
          animations.add(animation);
          const cleanup = () => animations.delete(animation);
          animation.addEventListener('finish', cleanup, { once: true });
          animation.addEventListener('cancel', cleanup, { once: true });
        }
        observer.unobserve(entry.target);
      }
    }, { threshold: .08 });
    root.querySelectorAll('.stat-card, .school-card, .assistant-card, .deadline-card, .journey-note, .catalog-hero, .profile-card, .profile-aside').forEach(element => observer.observe(element));
  }
  function init() {
    reduced.addEventListener('change', sync);
    pointer.addEventListener('change', resetPointer);
    sync();

    document.addEventListener('pointermove', event => {
      if (!enabled() || !pointer.matches || event.pointerType === 'touch') return;
      const card = event.target.closest('.stat-card, .school-card');
      const hero = event.target.closest('.hero');
      if (card !== currentCard || hero !== currentHero) resetPointer();
      currentCard = card;
      currentHero = hero;
      cancelAnimationFrame(frame);
      const { clientX, clientY } = event;
      frame = requestAnimationFrame(() => {
        frame = 0;
        const element = card || hero;
        if (!element?.isConnected) return;
        const bounds = element.getBoundingClientRect();
        const x = Math.max(-.5, Math.min(.5, (clientX - bounds.left) / bounds.width - .5));
        const y = Math.max(-.5, Math.min(.5, (clientY - bounds.top) / bounds.height - .5));
        if (card) {
          card.style.setProperty('--tilt-x', `${-y * 4}deg`);
          card.style.setProperty('--tilt-y', `${x * 4}deg`);
        } else {
          hero.style.setProperty('--scene-x', `${x * 12}px`);
          hero.style.setProperty('--scene-y', `${y * 10}px`);
        }
      });
    }, { passive: true });
    document.addEventListener('pointerout', event => {
      const element = currentCard || currentHero;
      if (element && !element.contains(event.relatedTarget)) resetPointer();
    }, { passive: true });
    window.addEventListener('blur', resetPointer);
    document.addEventListener('visibilitychange', () => {
      document.documentElement.classList.toggle('motion-sleeping', document.hidden);
      if (document.hidden) resetPointer();
    });
  }
  return { init, reveal };
})();

// A local timeline for the current season; catalogue dates remain marked as examples.
const ApplicationCalendar = (() => {
  let opened=false;
  let selectedMonth;
  const root=()=>document.querySelector('#application-calendar');
  const trigger=()=>document.querySelector('.calendar-toggle');
  const monthKey=date=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
  function entries() {
    const projects=ProgramWorkspace.items().filter(s=>s.deadline).map(s=>{
      const [month,day]=s.deadline.split('.').map(Number);
      const date=new Date(state.cycleYear-(month>=8?1:0),month-1,day,12);
      return {date,title:s.name,description:s.program,example:true,action:'application-detail',id:s.id};
    });
    const personal=tasks.filter(t=>t.due&&!state.completed.includes(t.id)).flatMap(t=>{
      if(!/^\d{4}-\d{2}-\d{2}$/.test(t.due))return [];
      const date=new Date(`${t.due}T12:00:00`);
      return Number.isNaN(date.getTime())?[]:[{date,title:t.title,description:t.school||'个人申请待办',example:false,action:'task-detail',id:t.id}];
    });
    return [...projects,...personal].sort((a,b)=>a.date-b.date||a.title.localeCompare(b.title));
  }
  function draw() {
    const panel=root();if(!panel)return;
    const all=entries();
    const current=new Date();
    if(!selectedMonth){const next=all.find(item=>item.date>=new Date(current.getFullYear(),current.getMonth(),current.getDate()));selectedMonth=monthKey(next?.date||current);}
    const [year,month]=selectedMonth.split('-').map(Number);
    const visible=all.filter(item=>monthKey(item.date)===selectedMonth);
    panel.innerHTML=`<div class="calendar-panel-heading"><div><span>APPLICATION TIMELINE</span><h2>申请日历</h2></div><button class="icon-button" data-action="calendar-close" aria-label="收起申请日历">${icon('close')}</button></div><div class="calendar-month-controls"><button class="icon-button calendar-prev" data-action="calendar-month" data-offset="-1" aria-label="上一个月">${icon('arrow')}</button><h3 aria-live="polite">${year} 年 ${month} 月</h3><button class="icon-button" data-action="calendar-month" data-offset="1" aria-label="下一个月">${icon('arrow')}</button><button class="text-button" data-action="calendar-today">本月</button></div><p class="calendar-season">${state.cycleYear} Fall · ${visible.length} 项时间记录</p><div class="calendar-timeline" aria-live="polite">${visible.length?visible.map(item=>{
      const today=new Date(current.getFullYear(),current.getMonth(),current.getDate());
      const days=Math.round((item.date-new Date(today.getFullYear(),today.getMonth(),today.getDate(),12))/86400000);
      const status=item.example?'示例 · 待核验':days<0?'已过计划日期':days===0?'今天到期':`还有 ${days} 天`;
      return `<button class="calendar-event ${!item.example&&days<=7?'urgent':''}" data-action="${item.action}" data-id="${escapeHTML(item.id)}"><span class="calendar-event-date"><b>${String(item.date.getDate()).padStart(2,'0')}</b><small>${month} 月</small></span><span class="calendar-event-copy"><strong>${escapeHTML(item.title)}</strong><span>${escapeHTML(item.description)}</span><em class="${item.example?'example':''}">${status}</em></span>${icon('arrow')}</button>`;
    }).join(''):'<div class="calendar-empty">这个月暂无时间记录。<br>切换月份查看，或到“我的申请”添加带日期的待办。</div>'}</div><p class="calendar-source-note">院校示例日期按当前申请季排列，尚未核验；正式截止时间与时区请以项目官网为准。</p><a class="calendar-all" href="#applications">管理申请与待办 ${icon('arrow')}</a>`;
  }
  function close(focus=false) {
    opened=false;if(root())root().hidden=true;
    trigger()?.setAttribute('aria-expanded','false');
    if(focus)trigger()?.focus();
  }
  function toggle() {
    if(opened){close();return;}
    selectedMonth=undefined;opened=true;draw();root().hidden=false;
    trigger()?.setAttribute('aria-expanded','true');root().focus();
  }
  function handle(action,button) {
    if(action==='notifications')toggle();
    else if(action==='calendar-close')close(true);
    else if(action==='calendar-month'){
      const [year,month]=selectedMonth.split('-').map(Number);
      selectedMonth=monthKey(new Date(year,month-1+Number(button.dataset.offset),1));draw();
      root().querySelector(`[data-action="calendar-month"][data-offset="${button.dataset.offset}"]`)?.focus();
    }
    else if(action==='calendar-today'){selectedMonth=monthKey(new Date());draw();root().querySelector('[data-action="calendar-today"]').focus();}
    else return false;
    return true;
  }
  function outside(event){if(opened&&!event.target.closest('#application-calendar,.calendar-toggle,[data-action="notifications"]'))close();}
  function onKeydown(event){if(opened&&event.key==='Escape'){event.preventDefault();close(true);return true;}return false;}
  function sync(){if(opened)draw();}
  return {handle,close,outside,onKeydown,sync};
})();

function goTo(target, updateURL = true) {
  ApplicationCalendar.close();

  // fragment link can replace that document, so always render navigation here.
  if (updateURL && location.hash !== `#${activePage}`) {
    try { history.pushState(null, '', `#${activePage}`); } catch { /* The preview can still navigate in memory. */ }
  }
  render();
  window.scrollTo(0,0);
}

function syncLibraryNav() {

  document.querySelectorAll('[data-library-page]').forEach(link => {
    const current = link.dataset.libraryPage === activePage;

    if (current) link.setAttribute('aria-current', 'page');

document.addEventListener('click',event=>{
  ApplicationCalendar.outside(event);
  if (libraryNavOpen && matchMedia('(max-width: 760px)').matches && !event.target.closest('.library-nav-group')) closeLibraryNav();
  if(event.target.classList.contains('modal-overlay')){closeModal();return;}
  const link = event.target.closest('a[href^="#"]');
  if (link && pages[link.getAttribute('href').slice(1)]) {
    event.preventDefault();
    closeModal();
    goTo(link.getAttribute('href').slice(1));
    if (link.hasAttribute('data-library-page') && matchMedia('(max-width: 760px)').matches) closeLibraryNav(true);
    return;
  }
  const button=event.target.closest('[data-action]');if(!button)return;
  const {action,id}=button.dataset;
  if(ApplicationCalendar.handle(action,button))return;
  if(GPTWorkspace.handle(action,button))return;
  if(WritingWorkspace.handle(action,button))return;
  if(MapWorkspace.handle(action,button))return;
  if(ProgramSearch.handle(action,button))return;
  if(ProgramWorkspace.handle(action,button))return;
  if(ApplicationWorkspace.handle(action,button))return;
  if(ShortlistWorkspace.handle(action,button))return;
  if(SeasonWorkspace.handle(action,button))return;
  if (action === 'toggle-library-nav') {
    libraryNavOpen = !libraryNavOpen;
    syncLibraryNav();
    return;
  }
  if(action==='contact-author')contactAuthor();
  if(action==='account')accountDialog();
  if(action==='close-modal'||action==='close-link'){closeModal();return;}
  if(action==='navigate')goTo(button.dataset.page);
  if(action==='undo') {const undo=undoAction;undoAction=null;clearTimeout(toastTimer);document.querySelector('#toast').classList.remove('visible');if(undo)undo();return;}
  if(action==='add-task')addTaskDialog();
  if(action==='command')showCommand();
  if(action==='ranking-source')rankingSourceDialog();
  if(action==='download-ranking')downloadRankingSource();
  if(action==='command-route'){closeModal();goTo(button.dataset.page);}
  if(action==='command-school'){closeModal();schoolDetail(id);}
  if(action==='reset-filters'){search='';activeTier='all';activeDiscipline='all';schoolSort='default';render();}
  if(action==='clear-school-search'){search='';const input=document.querySelector('#school-search');input.value='';refreshLibrary();input.focus();}
  if(action==='application-view'){applicationView=button.dataset.view;render();}
  if(action==='compare-toggle') {
    if(comparisonIds.includes(id)) comparisonIds=comparisonIds.filter(value=>value!==id);
    else if(comparisonIds.length<3)comparisonIds.push(id);
    else {toast('一次最多对比 3 个项目，先移除一个再试试');return;}
    const focused=document.activeElement;
    document.querySelectorAll(`.compare-toggle[data-id="${id}"]`).forEach(el=>{const selected=comparisonIds.includes(id);el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',String(selected));el.innerHTML=`${icon(selected?'check':'compare')}${selected?'已选对比':'加入对比'}`;});
    renderCompareBar();
    if(!focused?.isConnected)document.querySelector(`.compare-toggle[data-id="${id}"]`)?.focus();
  }
  if(action==='show-comparison')showComparison();
  if(action==='clear-comparison'){comparisonIds=[];render();}
  if(action==='bookmark'){
    const removed=state.saved.includes(id);
    state.saved=removed?state.saved.filter(value=>value!==id):[...state.saved,id];
    save();render();if(button.dataset.modal)schoolDetail(id);
    toast(removed?'已从我的申请清单移除':'已加入我的申请清单',()=>{state.saved=removed?[...state.saved,id]:state.saved.filter(value=>value!==id);save();render();if(document.querySelector('.modal'))schoolDetail(id);});
  }
  if(action==='school')schoolDetail(id);
  if(action==='task'){
    const previous=[...state.completed];
    const completed=!state.completed.includes(id);
    state.completed=completed?[...state.completed,id]:state.completed.filter(value=>value!==id);
    save();closeModal();render();
    toast(completed?'又往前一步，做得很好。':'已恢复为待完成',()=>{state.completed=previous;save();render();});
  }
  if(action==='task-filter'){taskFilter=button.dataset.filter;render();}
  if(action==='tier'){activeTier=button.dataset.tier;render();}
  if(action==='edit-doc'){activeDoc=id;state.activeDocumentId=id;save();goTo('documents');}
  if(action==='profile')goTo('profile');
  if(action==='chat')assistantReply(button.dataset.question);

  if(action==='task-detail'){
    const task=tasks.find(t=>t.id===id);
    if(!task)return;
    openModal(task.title,`<p>${task.custom?`这是你安排的下一小步。${task.due?`计划在 ${escapeHTML(task.due)} 完成。`:''}<br>关联项目：${escapeHTML(task.school)}`:id==='letter'?'提前联系了解你的老师或合作导师，说明申请目标，并提供简历、经历摘要与项目截止日期。确认推荐人的意愿后，再按项目要求发送正式邀请。':'整理已有成绩单与语言考试报告，逐项核对项目对官方送分、翻译件和有效期的要求。'}</p><p class="disclaimer">具体申请要求以各项目官网为准。</p><div class="modal-actions"><button class="primary-button" data-action="task" data-id="${escapeHTML(id)}">${state.completed.includes(id)?'恢复为待完成':'标记为已完成'} ${icon('check')}</button></div>`);
  }
  if(action==='guide')openModal('你的申请路线图',`<p>每个人的节奏不同。把申请拆成几个清晰的阶段，一步一步来。</p>${[['认识自己','整理教育背景、真实经历、兴趣、预算和读研目标。'],['探索项目','按专业和目标比较项目，核验官网要求，形成申请清单。'],['准备材料','联系推荐人、整理成绩与语言材料，记录文书经历素材。'],['打磨与提交','按项目题目修改文书，核对材料完整性、截止时间和提交状态。'],['等待与选择','记录结果，比较课程、费用与发展方向，做出适合自己的选择。']].map(([title,desc],i)=>`<div class="guide-step"><b>${i+1}</b><div><h3>${title}</h3><p>${desc}</p></div></div>`).join('')}`);
});

  MapWorkspace.onInput(event.target);

    search=event.target.value;refreshLibrary();
  }
  if(event.target.id==='document-editor'){
    WritingWorkspace.onInput(event.target);
  }
  if(event.target.id==='command-query'){commandIndex=-1;document.querySelector('#command-results').innerHTML=commandResults(event.target.value);}

document.addEventListener('change',event=>{
  ProgramSearch.onChange(event.target);
  ProgramWorkspace.onChange(event.target);
  ApplicationWorkspace.onChange(event.target);
  MapWorkspace.onChange(event.target);
  ShortlistWorkspace.onChange(event.target);
  if(event.target.dataset.status){const id=event.target.dataset.status;state.statuses[id]=event.target.value;save();render();ApplicationWorkspace.enter(id);}

document.addEventListener('submit',event=>{
  const form=event.target.closest('[data-form]');if(!form)return;event.preventDefault();
  const data=new FormData(form);
  if(GPTWorkspace.onSubmit(form,data))return;
  if(ApplicationWorkspace.onSubmit(form,data))return;
  if(SeasonWorkspace.onSubmit(form,data))return;
  if(form.dataset.form==='chat'){const question=String(data.get('question')||'').trim();if(question)assistantReply(question);}
  if(form.dataset.form==='task') {
    const title=String(data.get('title')||'').trim().slice(0,120);if(!title)return;
    const task={id:`custom-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,title,school:String(data.get('school')||'通用申请材料'),due:String(data.get('due')||''),category:'个人待办',tag:'待开始',color:'sage',custom:true};
    tasks.push(task);state.customTasks.push(task);save();taskFilter='pending';closeModal();render();toast('新的小目标已加入清单');
  }
  if(form.dataset.form==='profile'){
    state.profile={...state.profile,...Object.fromEntries([...data].map(([key,value])=>[key,String(value).trim()]))};
    state.profileSaved=true;
    const persisted=save();render();ShortlistWorkspace.show();toast(persisted?'档案已保存，接下来看看选校建议':'档案已更新，暂未保存到浏览器');
  }
});
document.addEventListener('pointerdown',MapWorkspace.pointerDown);

document.addEventListener('pointerup',MapWorkspace.pointerUp);

document.addEventListener('keydown',event=>{
  if(ApplicationCalendar.onKeydown(event))return;
  if (event.key === 'Escape' && libraryNavOpen && !document.querySelector('.modal')) { closeLibraryNav(true); return; }
  MapWorkspace.onKeydown(event);
  const editing=event.target.matches('input,textarea,select,[contenteditable="true"]');
  if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();showCommand();return;}
  if(event.key==='/'&&!editing&&!document.querySelector('.modal')){event.preventDefault();if(activePage==='schools')document.querySelector('#school-search')?.focus();else showCommand();return;}
  if(event.target.id==='command-query'&&['ArrowDown','ArrowUp','Enter'].includes(event.key)) {
    const results=[...document.querySelectorAll('.command-result')];
    if(results.length){event.preventDefault();if(event.key==='Enter'){results[Math.max(0,commandIndex)]?.click();return;}commandIndex=commandIndex===-1?(event.key==='ArrowDown'?0:results.length-1):(commandIndex+(event.key==='ArrowDown'?1:-1)+results.length)%results.length;results.forEach((el,i)=>el.classList.toggle('highlighted',i===commandIndex));results[commandIndex].scrollIntoView({block:'nearest'});}
    return;
  }
  const modal=document.querySelector('.modal');if(!modal)return;
  if(event.key==='Escape')closeModal();
  if(event.key==='Tab'){
    const focusable=[...modal.querySelectorAll('button,a[href],input,textarea,select')].filter(el=>!el.disabled);
    const first=focusable[0],last=focusable.at(-1);
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
});
document.addEventListener('dragstart',event=>{const card=event.target.closest('[data-drag-school]');if(card){event.dataTransfer.setData('text/plain',card.dataset.dragSchool);event.dataTransfer.effectAllowed='move';card.classList.add('dragging');}});
document.addEventListener('dragend',event=>{event.target.closest('[data-drag-school]')?.classList.remove('dragging');document.querySelectorAll('.drop-ready').forEach(el=>el.classList.remove('drop-ready'));});
document.addEventListener('dragover',event=>{const column=event.target.closest('[data-drop-status]');if(column){event.preventDefault();column.classList.add('drop-ready');}});
document.addEventListener('dragleave',event=>{const column=event.target.closest('[data-drop-status]');if(column&&!column.contains(event.relatedTarget))column.classList.remove('drop-ready');});
document.addEventListener('drop',event=>{const column=event.target.closest('[data-drop-status]');if(!column)return;event.preventDefault();const id=event.dataTransfer.getData('text/plain');if(!ProgramWorkspace.items().some(s=>s.id===id))return;state.statuses[id]=column.dataset.dropStatus;save();render();toast(`已更新为「${column.dataset.dropStatus}」`);});
